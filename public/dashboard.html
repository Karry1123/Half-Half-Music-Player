      </button>
      <${ZipExport} variant="icon" storage=${LocalLib} name=${title} trackIds=${playlist?.trackIds} />
    </div>
  </div>`;
}

/** 歌单里还没下载到这台设备的歌（其他设备加入的）：下载 / 移除 / 音源失效时替换 */

            <input name="url" type="url" required placeholder="粘贴重新搜到的 B 站 / YouTube 链接" aria-label=${`替换 ${t.title} 的音源`} class="min-w-0 flex-1 rounded-lg border border-ink-700 bg-ink-850 px-3 py-1.5 text-xs outline-none placeholder:text-sand-500 focus:border-sync" />

/** 曲目"⋯"操作面板（手机是底部抽屉）：添加到其他歌单 / 从当前歌单移除 / 从本机删除 */
function TrackMenuSheet() {
  const menu = useStore((s) => s.trackMenu);
  const item = useStore((s) => (s.trackMenu ? s.library.find((x) => x.id === s.trackMenu.itemId) : null));
  const currentId = useStore((s) => s.currentId);
  const playlists = useStore((s) => s.playlists);
  const close = () => set({ trackMenu: null });
  useBackLayer(!!menu, close);
  if (!menu || !item) return null;
  const viewing = menu.viewId !== ALL_ID ? playlists.find((p) => p.id === menu.viewId) : null;
  const memberOf = item.localId ? playlistsOf(playlists, item.localId) : [];
  const addTo = async () => {
    close();
    const picked = await askPlaylists({ title: '添加到歌单', subtitle: item.title, mode: 'add', preselect: memberOf });
    const fresh = (picked || []).filter((id) => !memberOf.includes(id));
    if (fresh.length) addItemsToPlaylists(fresh, [item.id]);
  };
  const removeHere = () => {
    close();
    removeItemFromPlaylist(viewing.id, item.id);
  };
  const del = () => {
    close();
    if (item.id === currentId) return toast('正在播放的歌不能删除，先切到别的歌', 'warn');
    if (!confirm(item.localId ? `从本机删除《${item.title}》？\n会同时从所有歌单里移除，之后需要重新下载。` : `从曲库移除《${item.title}》？`)) return;
    session.remove(item.id);
  };
  const row = 'flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm hover:bg-white/5';
  return html`<div class="fixed inset-0 z-[70] flex items-end justify-center bg-ink-950/70 backdrop-blur-sm sm:items-center sm:p-6" onClick=${(e) => e.target === e.currentTarget && close()}>
    <section role="dialog" aria-modal="true" aria-label=${`${item.title} 的操作`} class="w-full max-w-sm overflow-hidden rounded-t-3xl border border-ink-700 bg-ink-900 p-2 shadow-2xl sm:rounded-3xl">
      <div class="flex items-center gap-3 px-3 pb-3 pt-2">
        <${Cover} item=${item} size=${44} />
        <div class="min-w-0">
          <div class="truncate text-sm font-semibold">${item.title}</div>
          <div class="truncate text-xs text-sand-500">${item.artist || item.sourceLabel}${memberOf.length ? ` · 在 ${memberOf.length} 个歌单里` : ''}</div>
        </div>
      </div>
      <button class=${row} onClick=${addTo}><${ListPlus} size=${17} class="text-host" /> 添加到歌单…</button>
      ${viewing && html`<button class=${row} onClick=${removeHere}><${ListMinus} size=${17} class="text-sand-400" /> 从《${viewing.name}》移除<span class="ml-auto text-xs text-sand-500">歌曲保留</span></button>`}
      <button class=${cx(row, 'text-guest')} onClick=${del}><${Trash2} size=${17} /> ${item.localId ? '从本机删除' : '从曲库移除'}</button>
      <button class=${cx(row, 'justify-center text-sand-400')} onClick=${close}>取消</button>
    </section>
  </div>`;
}

/** "放到哪个歌单"：下载 / 导入前选择，或给已有歌曲"添加到歌单"。可以在这里直接新建 */
function PlaylistPicker() {
  const req = useStore((s) => s.playlistPicker);
  const playlists = useStore((s) => s.playlists);
  const [sel, setSel] = useState(() => new Set());
  const [name, setName] = useState('');
  const [skip, setSkip] = useState(false);
  useBackLayer(!!req, () => closePlaylistPicker(null));
  useEffect(() => {
    if (!req) return;
    setSel(new Set(req.mode === 'add' ? [] : req.preselect || [INBOX_ID]));
    setName('');
    setSkip(false);
  }, [req]);
  if (!req) return null;
  const locked = new Set(req.mode === 'add' ? req.preselect || [] : []); // 已在其中：显示为勾选，不能在这里取消
  const toggle = (id) => setSel((s) => {
    const n = new Set(s);
    n.has(id) ? n.delete(id) : n.add(id);
    return n;
  });
  const create = async (e) => {
    e.preventDefault();
    try {
      const p = await playlistStore.create(name);

function MiniWave({ active }) {
  const canvas = useRef(null);
  useEffect(() => {
    let raf;
    const data = new Uint8Array(32);
    const draw = () => {
      const c = canvas.current;
      const an = session.out.analyser;
      if (c) {
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        if (an && active) an.getByteFrequencyData(data);
        for (let i = 0; i < 16; i++) {
          const v = active ? (an ? data[i + 1] / 255 : 0.3 + 0.3 * Math.sin(Date.now() / 180 + i)) : 0.08;
          const h = Math.max(2, v * c.height);
          ctx.fillStyle = `hsl(${30 - i * 2.5} 85% ${60 + i}%)`;
          ctx.fillRect(i * 5, c.height - h, 3, h);
        }
      }
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => cancelAnimationFrame(raf);
  }, [active]);
  return html`<canvas ref=${canvas} width="80" height="22" class="h-[22px] w-20" aria-hidden="true" />`;
}

function SeekBar() {
  const duration = useStore((s) => s.duration);

  const pos = usePosition();
  const [drag, setDrag] = useState(null);
  const v = drag ?? pos;
  const canSeek = loaded && (role !== 'guest' || conn === 'open');
  const commit = () => {
    if (drag == null) return;
    session.act('seek', { position: drag });
    setDrag(null);
  };
  return html`<div class="flex w-full items-center gap-3 text-[11px] text-sand-400 tabular">
    <span class="w-10 text-right">${fmtTime(v)}</span>
    <input type="range" class="hh flex-1" min="0" max=${duration || 0} step="0.1" value=${v} disabled=${!canSeek}
      style=${{ '--fill': `${duration ? (v / duration) * 100 : 0}%` }} aria-label="播放进度"
      onInput=${(e) => setDrag(Number(e.target.value))} onPointerUp=${commit} onKeyUp=${commit} onBlur=${commit} />

function SyncStatus() {
  const syncNote = useStore((s) => s.syncNote);
  const waiting = useStore((s) => s.waitingPeer);
  const transfer = useStore((s) => s.transfer);
  const peer = useStore((s) => s.peer);
  const drift = useStore((s) => s.drift);
  const [, force] = useState(0);
  useEffect(() => {
    const t = setInterval(() => force((x) => x + 1), 1000);
    return () => clearInterval(t);
  }, []);
  const fresh = syncNote && Date.now() - syncNote.at < 6000;
  let icon = Activity;
  let text = peer ? `已与 ${peer.name} 同步${drift != null ? ` · 偏差 ${drift}ms` : ''}` : '单机播放';
  let tone = 'text-sand-400';
  if (transfer) {
    icon = transfer.dir === 'send' ? Upload : Download;
    text = `${transfer.label} ${Math.round(transfer.pct * 100)}%`;
    tone = 'text-host';
  } else if (waiting) {
    icon = Loader2;
    text = `等 ${peer?.name || '对方'} 缓冲完一起开始…`;
    tone = 'text-host';
  } else if (fresh) {
    icon = syncNote.kind === 'warn' ? AlertTriangle : syncNote.kind === 'sync' ? RefreshCw : Activity;
    text = syncNote.text;
    tone = syncNote.kind === 'warn' ? 'text-guest' : syncNote.kind === 'sync' ? 'text-sync' : 'text-sand-50';
  }
  return html`<div class=${cx('flex min-w-0 items-center gap-1.5 text-xs', tone)} aria-live="polite">
    <${icon} size=${14} class=${cx('shrink-0', icon === Loader2 && 'animate-spin')} />
    <span class="truncate">${text}</span>
  </div>`;
}

const MODE_ICON = { order: ListOrdered, loopAll: Repeat, loopOne: Repeat1, shuffle: Shuffle };

/** 系统同步延迟指示：单人 / 连接路径 + 往返延迟 + 同步偏差 */
function LinkIndicator() {
  const role = useStore((s) => s.role);
  const conn = useStore((s) => s.conn);
  const link = useStore((s) => s.link);
  const ping = useStore((s) => s.ping);
  const drift = useStore((s) => s.drift);
  const away = useStore((s) => s.peerAway);
  const chip = (tone, Icon, text, title, spin) => html`<span class=${cx('inline-flex max-w-full items-center gap-1 truncate rounded-full px-2 py-0.5 text-[10px] font-medium tabular', tone)} title=${title}>
    <${Icon} size=${11} class=${cx('shrink-0', spin && 'animate-spin')} /> <span class="truncate">${text}</span></span>`;
  if (!role) return chip('bg-sync/10 text-sync', User, '单人 · 本地播放', '单人模式：不经过网络，没有同步延迟');
  if (conn === 'reconnecting') return chip('bg-host/15 text-host', RefreshCw, '重连中 · 音乐不中断', '连接中断，正在后台自动重连；本地按最后的同步点继续播放', true);
  if (conn !== 'open') return chip('bg-white/5 text-sand-400', Loader2, role === 'host' ? '等待伙伴' : '连接中', '', conn === 'connecting');
  if (away) return chip('bg-host/15 text-host', AlertTriangle, '对方在后台 / 无响应', '对方切到后台或网络卡顿，恢复后自动校准');
  const ms = link?.rtt ?? ping;
  const tone = ms == null ? 'bg-white/5 text-sand-400' : ms < 80 ? 'bg-sync/10 text-sync' : ms < 200 ? 'bg-host/15 text-host' : 'bg-guest/15 text-guest';
  const parts = [link ? PATH_LABEL[link.kind] : 'P2P', ms != null ? `${ms}ms` : null, role === 'guest' && drift != null ? `偏差 ${drift > 0 ? '+' : ''}${drift}ms` : null].filter(Boolean);
  return chip(tone, link?.kind === 'relay' ? Server : Gauge, parts.join(' · '), `连接路径：${link ? PATH_TIP[link.kind] : '检测中'}\n往返延迟：${ms ?? '–'}ms${role === 'guest' ? `\n与房主的播放偏差：${drift ?? '–'}ms（±15ms 内视为完全同步）` : ''}`);
}

const SORTS = [
  ['addedAt', 'desc', '最近添加'],
  ['addedAt', 'asc', '最早添加'],
  ['size', 'desc', '体积最大'],
  ['title', 'asc', '按歌名'],
];
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/** 本机曲库管理：排序、大小、单曲删除、导出为真实文件、存储空间 */
function LocalLibraryModal() {
  useBackLayer(useStore(s => s.localLibOpen), () => set({ localLibOpen: false }));
  const open = useStore((s) => s.localLibOpen);
  const offline = useStore((s) => s.offline);
  const role = useStore((s) => s.role);
  const [sort, setSort] = useState(0);
  const [tracks, setTracks] = useState(null);
  const [covers, setCovers] = useState({});
  const [info, setInfo] = useState(null);
  const [busy, setBusy] = useState(null);

  useEffect(() => {
    if (!open) return;
    let alive = true;
    const [key, order] = SORTS[sort];
    LocalLib.listTracks({ sort: key, order }).then(async (list) => {
      if (!alive) return;
      setTracks(list);
      const entries = await Promise.all(list.map(async (t) => [t.id, await LocalLib.coverUrl(t)]));
      if (alive) setCovers(Object.fromEntries(entries));
    }, (e) => setTracks({ error: e.message }));
    LocalLib.usage().then((u) => alive && setInfo(u));
    const onKey = (e) => e.key === 'Escape' && set({ localLibOpen: false });
    window.addEventListener('keydown', onKey);
    return () => { alive = false; window.removeEventListener('keydown', onKey); };
  }, [open, sort, offline]);

  if (!open) return null;
  const close = () => set({ localLibOpen: false });
  const inQueue = (t) => get().library.some((x) => x.hash === t.hash);

  const del = async (t) => {
    if (!confirm(`从本机删除《${t.title}》？\n删除后需要重新下载。`)) return;
    const item = get().library.find((x) => x.localId === t.id);
    if (item && item.id === get().currentId && role !== 'guest') return toast('正在播放的歌不能删除，先切到别的歌', 'warn');
    await LocalLib.deleteTrack(t.id).catch((e) => toast(`删除失败：${e.message}`, 'warn'));
    if (item && role !== 'guest') session.remove(item.id);
    refreshOffline();
  };
  const exportOne = async (t) => {
    setBusy(t.id);
    try {
      const r = await LocalLib.exportTrack(t.id);
      if (r === 'opened') toast('已交给系统应用，可在其中保存或分享');
      else if (r === 'saved') toast(`已保存《${t.title}》`);
      else if (r === 'downloaded') toast(isIOS ? '已交给浏览器下载，可在"文件"App → 下载项 中找到' : '已开始下载');
    } catch (e) {
      toast(`导出失败：${e.message}`, 'warn');
    } finally {
      setBusy(null);
    }
  };
  const exportAll = async () => {
    setBusy('all');
    try {
      const r = await LocalLib.exportAll((d, n) => setBusy(`all:${d}/${n}`));
      if (r.mode === 'folder') toast(`已写入文件夹：新增 ${r.written} 首${r.skipped ? `，${r.skipped} 首已存在跳过` : ''}`);
      else if (r.mode === 'downloads') toast(`已触发 ${r.written} 个下载`);
    } catch (e) {
      toast(`导出失败：${e.message}`, 'warn');
    } finally {
      setBusy(null);
    }
  };
  const addToQueue = async (t) => {
    if (role === 'guest') return toast('在别人的房间里，歌单属于房主', 'warn');
    if (inQueue(t)) return toast('已经在歌单里了');
    set((s) => ({ library: [...s.library, fromLocal(t, covers[t.id])] }));
    session.broadcastLibrary();
  };
  const persist = async () => {
    const ok = await LocalLib.requestPersist();
    toast(ok ? '已开启持久保存：浏览器不会自动清理这些歌曲' : '浏览器没有同意（常用网站会自动获得，或安装为应用后再试）', ok ? 'info' : 'warn');
    LocalLib.usage().then(setInfo);
  };

  const list = Array.isArray(tracks) ? tracks : [];
  const pct = info?.quota ? Math.min(100, (info.used / info.quota) * 100) : 0;

  return html`<div class="fixed inset-0 z-[70] flex items-end justify-center bg-ink-950/70 backdrop-blur-sm sm:items-center sm:p-6" onClick=${(e) => e.target === e.currentTarget && close()}>

        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-sync/15 text-sync"><${HardDrive} size=${19} /></span>
        <div class="min-w-0 flex-1">

          <p class="text-xs text-sand-500">${LocalLib.isNative ? '保存在 App 私有目录，离线可播放；卸载应用会删除' : '保存在这台设备的浏览器里，离线可播放，下次打开自动出现'}</p>
        </div>
        <button class="grid h-8 w-8 place-items-center rounded-full text-sand-400 hover:bg-ink-800 hover:text-sand-50" onClick=${close} aria-label="关闭"><${X} size=${17} /></button>
      </header>

      <div class="space-y-2 border-b border-ink-700/70 px-5 py-3 text-xs text-sand-400">
        <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
          <span class="tabular">${list.length} 首 · ${fmtSize(info?.trackBytes || 0)}</span>
          ${info?.quota ? html`<span class="tabular">浏览器存储已用 ${fmtSize(info.used)} / 可用 ${fmtSize(info.quota)}</span>` : ''}
          <span class="flex-1" />
          ${info && (info.persisted
            ? html`<span class="inline-flex items-center gap-1 text-sync"><${ShieldCheck} size=${13} /> 持久保存</span>`
            : html`<button class="inline-flex items-center gap-1 text-guest hover:underline" onClick=${persist} title="未持久化时，浏览器可能在空间紧张时清理"><${AlertTriangle} size=${13} /> 申请持久保存</button>`)}
        </div>
        ${info?.quota ? html`<div class="h-1 overflow-hidden rounded-full bg-ink-700"><div class="h-full rounded-full bg-sync" style=${{ width: `${Math.max(pct, 0.5)}%` }} /></div>` : ''}
        ${isIOS && !isStandalone && html`<p class="rounded-lg bg-guest/10 px-3 py-2 text-guest">iPhone / iPad：Safari 会清理 7 天没打开过的网站数据。点分享按钮 →「添加到主屏幕」，从主屏幕打开就不会被清理。</p>`}
      </div>

      <div class="flex items-center gap-2 px-5 py-2.5">
        <${ArrowDownUp} size=${14} class="text-sand-500" />
        <select class="rounded-lg border border-ink-700 bg-ink-850 px-2 py-1 text-xs text-sand-200 outline-none focus:border-sync" value=${sort} onChange=${(e) => setSort(Number(e.target.value))} aria-label="排序">
          ${SORTS.map(([, , label], i) => html`<option value=${i}>${label}</option>`)}
        </select>
        <span class="flex-1" />
        <button class="inline-flex items-center gap-1.5 rounded-lg border border-ink-600 px-2.5 py-1 text-xs text-sand-200 hover:border-sync hover:text-sync disabled:opacity-40"
          disabled=${LocalLib.isNative || !list.length || !!busy} onClick=${exportAll} title=${LocalLib.canPickFolder() ? '选择一个文件夹，把所有歌曲写进去' : '逐个下载所有歌曲'}>
          ${busy?.startsWith?.('all') ? html`<${Loader2} size=${13} class="animate-spin" /> ${busy.slice(4) || '导出中'}` : html`<${FolderDown} size=${13} /> 全部导出`}
        </button>
        <${ZipExport} storage=${LocalLib} name="本机曲库" />
      </div>

      <div class="scroll-thin min-h-[160px] flex-1 overflow-y-auto px-3 pb-4" role="list">
        ${tracks?.error && html`<p class="p-6 text-center text-sm text-guest">${tracks.error}</p>`}
        ${tracks === null && html`<p class="p-6 text-center text-sm text-sand-500"><${Loader2} size=${16} class="mr-1 inline animate-spin" /> 读取中…</p>`}
        ${Array.isArray(tracks) && !list.length && html`<div class="m-2 grid place-items-center gap-2 rounded-2xl border-2 border-dashed border-ink-700 px-6 py-12 text-center text-sm text-sand-500">

        </div>`}
        ${list.map((t) => html`<div key=${t.id} role="listitem" class="group flex items-center gap-3 rounded-xl px-2 py-2 hover:bg-ink-800">
          <${Cover} item=${{ title: t.title, cover: covers[t.id] }} size=${40} />
          <div class="min-w-0 flex-1">
            <div class="truncate text-sm font-medium">${t.title}</div>
            <div class="flex items-center gap-2 truncate text-xs text-sand-500">
              <span class="truncate">${t.artist || t.sourceLabel}</span>
              <span class="tabular shrink-0">${fmtSize(t.size)}</span>
              ${t.duration ? html`<span class="tabular shrink-0">${fmtTime(t.duration)}</span>` : ''}
              <span class="hidden shrink-0 sm:inline">${new Date(t.addedAt).toLocaleDateString()}</span>
            </div>
          </div>
          ${role !== 'guest' && !inQueue(t) && html`<button class="grid h-8 w-8 place-items-center rounded-full text-sand-400 hover:text-host" onClick=${() => addToQueue(t)} title="加入歌单" aria-label=${`把 ${t.title} 加入歌单`}><${ListMusic} size=${15} /></button>`}
          <button class="grid h-8 w-8 place-items-center rounded-full text-sand-400 hover:text-sync disabled:opacity-40" disabled=${busy === t.id} onClick=${() => exportOne(t)} title="导出为文件" aria-label=${`导出 ${t.title}`}>

        </div>`)}

    </section>
  </div>`;
}

/** 连接设置：查看当前 ICE 配置、填写 TURN、测试中继是否可用 */
function ConnSettingsModal() {
  useBackLayer(useStore(s => s.connSettingsOpen), () => set({ connSettingsOpen: false }));
  const open = useStore((s) => s.connSettingsOpen);
  const ice = useStore((s) => s.ice);
  const [form, setForm] = useState(loadIceSettings);
  const [test, setTest] = useState(null);
  const [svc, setSvc] = useState({ api: stored('hh.api'), token: accessToken() });
  const [svcTest, setSvcTest] = useState(null);
  const [name, setName] = useState(get().me.name);
  const [showToken, setShowToken] = useState(false);
  useEffect(() => { if (open) { setForm(loadIceSettings()); setTest(null); setSvc({ api: stored('hh.api'), token: stored('hh.apiToken') }); setSvcTest(null); setName(get().me.name); setShowToken(false); } }, [open]);
  const svcBase = (svc.api || API_BASE).replace(/\/+$/, '');
  // 依次检查：服务是否在线（/health，可能要等冷启动）→ 跨域是否放行 → 令牌是否正确
  const testService = async () => {
    setSvcTest({ running: true });
    try {
      const h = await fetch(`${svcBase}/health`, { signal: AbortSignal.timeout(70000) });
      if (h.status === 403) return setSvcTest({ ok: false, text: '服务拒绝了这个网页的跨域请求：把当前网址加进后端的 CORS_ORIGINS' });
      const r = await fetch(`${svcBase}/api/health`, { headers: account.required && svcBase === API_BASE ? authHeaders() : svc.token ? { Authorization: `Bearer ${svc.token}` } : {}, signal: AbortSignal.timeout(15000) });
      if (r.status === 401) return setSvcTest({ ok: false, text: svc.token ? '令牌不对（401）' : '服务开启了访问令牌，请填写 API_TOKEN' });
      if (!r.ok) return setSvcTest({ ok: false, text: `服务返回 HTTP ${r.status}` });
      const j = await r.json();
      setSvcTest({ ok: true, text: `连接成功 · yt-dlp ${j.ytdlp || '未安装'} · ffmpeg ${j.ffmpeg ? '可用' : '无'} · 音源 ${j.providers.filter((p) => p.available).map((p) => p.label).join(' / ')}` });
    } catch (e) {
      setSvcTest({ ok: false, text: e.name === 'TimeoutError' ? '连接超时：服务可能在冷启动或地址不对' : `连不上：${e.message}（地址不对，或被 CORS 拦截）` });
    }
  };
  if (!open) return null;
  const close = () => set({ connSettingsOpen: false });
  const field = (k) => ({ value: form[k] || '', onInput: (e) => setForm({ ...form, [k]: e.target.value }) });
  const save = async () => {
    try { localStorage.setItem(ICE_KEY, JSON.stringify(form)); } catch {}
    // 昵称：立即生效，房间里的对方同步看到新名字
    const nick = name.replace(/\s+/g, ' ').trim().slice(0, 16);
    if (nick && nick !== get().me.name && !await setMyName(nick)) return;
    // 音乐服务地址 / 令牌变了：重新加载页面让所有请求用上新配置
    const svcChanged = svc.api.trim() !== stored('hh.api') || svc.token.trim() !== stored('hh.apiToken');
    if (svcChanged) {
      try {
        svc.api.trim() ? localStorage.setItem('hh.api', svc.api.trim().replace(/\/+$/, '')) : localStorage.removeItem('hh.api');
        svc.token.trim() ? localStorage.setItem('hh.apiToken', svc.token.trim()) : localStorage.removeItem('hh.apiToken');
      } catch {}
      return location.reload();
    }
    iceReady = applyIce(form);
    const c = await iceReady;
    toast(c.summary.errors.length ? `已保存，但 ${c.summary.errors[0]}` : `已应用：${c.summary.stun} 个 STUN、${c.summary.turn} 个 TURN${get().conn === 'open' ? '（下次连接生效）' : ''}`, c.summary.errors.length ? 'warn' : 'info');
    close();
  };
  // 只用 TURN 收集候选：能拿到 relay 候选 = 凭证正确、服务器可达
  const runTest = async () => {
    setTest({ running: true });
    const c = await buildIce(form);
    const turns = c.iceServers.filter((x) => [].concat(x.urls).some((u) => /^turns?:/.test(u)));
    if (!turns.length) return setTest({ ok: false, text: '没有配置任何 TURN：同一局域网 / 普通家庭宽带可以直连，跨境或 4G 很可能连不上' });
    const pc = new RTCPeerConnection({ iceServers: turns, iceTransportPolicy: 'relay' });
    pc.createDataChannel('t');
    const t0 = performance.now();
    const found = [];
    const errs = [];
    pc.onicecandidateerror = (e) => errs.push(`${e.url}：${e.errorCode} ${e.errorText}`);
    await new Promise((resolve) => {
      pc.onicecandidate = (e) => { if (!e.candidate) return resolve(); found.push(`${e.candidate.protocol?.toUpperCase()} ${Math.round(performance.now() - t0)}ms`); };
      pc.createOffer().then((o) => pc.setLocalDescription(o)).catch(resolve);
      setTimeout(resolve, 8000);
    });
    pc.close();
    setTest(found.length
      ? { ok: true, text: `TURN 可用：拿到 ${found.length} 个中继候选（${found.slice(0, 3).join('、')}）。双方都能连上这台 TURN 时，跨境也能连通` }
      : { ok: false, text: `TURN 不可用：${errs[0] || '8 秒内没有拿到中继候选'}${c.summary.errors[0] ? `；${c.summary.errors[0]}` : ''}` });
  };

  const input = 'w-full min-w-0 rounded-xl border border-ink-700 bg-ink-850 px-3 py-2.5 text-sm outline-none placeholder:text-sand-500 focus:border-host';
  const card = 'space-y-3 rounded-2xl border border-white/5 bg-white/[0.03] p-4';
  const result = (r, runningText) => r && html`<div class=${cx('rounded-xl px-3 py-2 text-xs leading-relaxed', r.running ? 'bg-white/5 text-sand-400' : r.ok ? 'bg-sync/10 text-sync' : 'bg-guest/10 text-guest')} role="status">

    <section role="dialog" aria-modal="true" aria-label="连接设置" class="flex max-h-[92vh] w-full max-w-lg flex-col overflow-hidden rounded-t-3xl border border-ink-700 bg-ink-900 shadow-2xl sm:rounded-3xl">
      <header class="flex items-center gap-3 border-b border-ink-700/70 px-5 py-4">

        <div class="min-w-0 flex-1">
          <h2 class="font-semibold">设置</h2>
          <p class="truncate text-xs text-sand-500">昵称 · 音乐服务 · 跨网络连接</p>
        </div>
        <button class="grid h-9 w-9 shrink-0 place-items-center rounded-full text-sand-400 hover:bg-ink-800 hover:text-sand-50" onClick=${close} aria-label="关闭"><${X} size=${18} /></button>
      </header>

      <div class="scroll-thin space-y-4 overflow-y-auto px-4 py-4 text-sm sm:px-5">
        <${StatsPanel} /><${AccountCard} client=${account} className=${card} />
        <section class=${card} aria-labelledby="set-me">
          <h3 id="set-me" class="text-xs font-semibold uppercase tracking-wider text-sand-500">我的昵称</h3>
          <div class="flex items-center gap-3">
            <${Avatar} profile=${{ ...me, name: name || me.name }} size=${40} />
            <input class=${input} value=${name} maxlength="16" placeholder="对方看到的名字" onInput=${(e) => setName(e.target.value)} aria-label="昵称" />
          </div>
          <p class="text-xs text-sand-500">进入房间后，对方看到的是这个名字。</p>
        </section>

        <section class=${card} aria-labelledby="set-svc">
          <div class="flex items-center gap-2">
            <h3 id="set-svc" class="flex-1 text-xs font-semibold uppercase tracking-wider text-sand-500">音乐服务（搜索 / 下载）</h3>
            <span class=${cx('shrink-0 rounded-full px-2 py-0.5 text-[11px]', hasToken ? 'bg-sync/15 text-sync' : 'bg-white/5 text-sand-400')}>${account.required ? '账号自动授权' : hasToken ? '已填令牌' : '未填令牌'}</span>
          </div>
          <div class="truncate text-xs text-sand-400" title=${svcBase}>服务器：<span class="text-sand-200">${API_BASE ? svcHost : '无（演示模式）'}</span></div>
          ${account.required ? html`<p class="text-xs text-sand-400">已使用账号授权，无需填写 API_TOKEN。</p>` : html`          <label class="block space-y-1.5">
            <span class="text-xs text-sand-400">访问令牌 <span class="text-sand-500">（服务端没设置就留空）</span></span>
            <div class="flex gap-2">
              <div class="relative min-w-0 flex-1">

                <button type="button" class="hh-chip absolute right-1 top-1/2 grid h-9 w-9 -translate-y-1/2 place-items-center rounded-lg text-sand-500 hover:text-sand-50" onClick=${() => setShowToken(!showToken)} aria-label=${showToken ? '隐藏令牌' : '显示令牌'}>
                  <${showToken ? EyeOff : Eye} size=${16} />

`}
          ${result(svcTest, '正在连接（服务休眠时首次唤醒要 30~60 秒）…')}
          <details class="group">

            <input class=${cx(input, 'mt-2')} placeholder=${HH.apiBase || '默认：本机 /music-api'} value=${svc.api} onInput=${(e) => setSvc({ ...svc, api: e.target.value })} aria-label="音乐服务地址" autocapitalize="off" spellcheck="false" />

/** 全窗口拖放导入 */
function DropOverlay() {
  const dragging = useStore((s) => s.dragging);
  useEffect(() => {
    let depth = 0;
    const has = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
    const enter = (e) => has(e) && (depth++, set({ dragging: true }));
    const leave = (e) => has(e) && --depth <= 0 && set({ dragging: false });
    const over = (e) => has(e) && e.preventDefault();
    const drop = (e) => {
      if (!has(e)) return;
      e.preventDefault();
      depth = 0;
      set({ dragging: false });
      importWithPicker([...e.dataTransfer.files]);
    };
    const evs = { dragenter: enter, dragleave: leave, dragover: over, drop };
    for (const [k, f] of Object.entries(evs)) window.addEventListener(k, f);
    return () => { for (const [k, f] of Object.entries(evs)) window.removeEventListener(k, f); };
  }, []);
  if (!dragging) return null;
  return html`<div class="pointer-events-none fixed inset-0 z-[60] grid place-items-center bg-ink-950/70 backdrop-blur-sm">
    <div class="rounded-3xl border-2 border-dashed border-host px-12 py-10 text-center">

const PLATFORMS = [
  { key: 'all', label: '全部', mock: null, live: [] },
  { key: 'bilibili', label: 'Bilibili', mock: 'bilibili', live: ['bilibili'] },
  { key: 'youtube', label: 'YouTube', mock: 'youtube', live: ['ytmusic', 'youtube'] },
];
const BRAND = {
  youtube: ['#ff0033', 'YouTube'],
  ytmusic: ['#ff0033', 'YT Music'],

/** 输入框里的提示：识别出是哪个平台的哪条视频（真正解析在服务端 /api/resolve） */
function detectLink(q) {
  const t = String(q || '');
  const bv = t.match(/BV[0-9A-Za-z]{10}/)?.[0];
  if (bv) return { platform: 'bilibili', label: `B站 · ${bv}${/[?&]p=(\d+)/.test(t) ? ` · P${t.match(/[?&]p=(\d+)/)[1]}` : ''}` };
  if (/b23\.tv\/|bili2233\.cn\//i.test(t)) return { platform: 'bilibili', label: 'B站短链（解析时自动展开）' };
  if (/(?:^|[\s/])av\d{3,}/i.test(t) && /bilibili|^av/i.test(t.trim())) return { platform: 'bilibili', label: `B站 · ${t.match(/av\d+/i)[0]}` };
  const yt = t.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  if (yt) return { platform: /music\.youtube/.test(t) ? 'ytmusic' : 'youtube', label: `${/music\.youtube/.test(t) ? 'YouTube Music' : 'YouTube'} · ${yt[1]}` };
  return null;
}

/** 关键词里贴的是链接？支持 YouTube / YouTube Music / B 站视频链接，直接生成可下载条目 */
function parseLink(q) {
  const yt = q.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/))([\w-]{11})/);
  if (yt) return { id: `youtube:${yt[1]}`, source: q.includes('music.youtube') ? 'ytmusic' : 'youtube', title: `YouTube 视频 ${yt[1]}`, pageUrl: `https://www.youtube.com/watch?v=${yt[1]}`, cover: `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg` };
  const bv = q.match(/(BV[0-9A-Za-z]{10})/);
  if (bv && /bilibili|b23|BV/i.test(q)) return { id: `bilibili:${bv[1]}`, source: 'bilibili', title: `B 站视频 ${bv[1]}`, pageUrl: `https://www.bilibili.com/video/${bv[1]}`, cover: null };
  // 短链 / av 号要服务端展开才知道 BV 号：先占位，真实模式下 /api/resolve 会给出完整信息
  if (detectLink(q)?.platform === 'bilibili') return { id: 'bilibili:pending', source: 'bilibili', title: 'B 站视频', pageUrl: null, cover: null, needsResolve: true };
  return null;
}

async function homeSearch(query, platformKey) {
  const q = query.trim();
  if (!q) return;
  const epoch = ++searchEpoch;
  set({ searching: true, query: q });
  try {
    const link = parseLink(q);
    if (link) {
      // 链接：不走搜索，直接给出一条可下载结果（演示模式下下载会合成演示音频）
      const [color, label] = BRAND[link.source];
      const real = get().apiMode === 'live' || viaHost();
      if (!real && link.needsResolve) return toast('短链 / av 号需要连接音乐服务才能解析，演示模式请直接粘贴含 BV 号的链接', 'warn');
      if (real) {
        try {
          const r = await api.resolve(q);
      if (epoch !== searchEpoch) return;
          if (r) {
            if (r.hint) toast(r.hint, 'info');
            return set({ results: [r], searchMeta: { link: true } });
          }
        } catch (e) {
      if (epoch !== searchEpoch) return;
          toast(`链接解析失败：${e.message}`, 'warn');
          return set({ results: [], searchMeta: { link: true } });
        }
      }
      return set({ results: [{ ...link, artist: '来自链接', sourceLabel: label, quality: '原始音轨', duration: null, size: null, mock: !real, fromLink: true }], searchMeta: { link: true } });
    }
    const p = PLATFORMS.find((x) => x.key === platformKey) || PLATFORMS[0];
    const live = get().apiMode === 'live' || viaHost();
    const sources = live ? p.live || [] : p.mock ? [p.mock] : [];
    const r = await api.search(q, sources);
      if (epoch !== searchEpoch) return;
    set({ results: r.results, searchMeta: r.meta });
  } catch (e) {
      if (epoch !== searchEpoch) return;
    toast(`搜索失败：${e.message}`, 'warn');
  } finally {
    if (epoch === searchEpoch) set({ searching: false });
  }
}

/** 网络 & STUN 连通性自检：真实收集一次 ICE 候选，看能否拿到 srflx（STUN）/ relay（TURN） */
async function probeNetwork() {
  await iceReady;
  const conn = navigator.connection;
  const base = { checked: false, online: navigator.onLine, type: conn?.effectiveType || null };
  set({ net: base });
  if (!window.RTCPeerConnection) return set({ net: { ...base, checked: true, webrtc: false } });
  const t0 = performance.now();
  const pc = new RTCPeerConnection({ iceServers: PEER_OPTIONS.config.iceServers });
  const found = { srflxMs: null, relayMs: null, host: 0 };
  pc.createDataChannel('probe');
  const done = new Promise((resolve) => {
    pc.onicecandidate = (e) => {
      if (!e.candidate) return resolve();
      const ms = Math.round(performance.now() - t0);
      if (e.candidate.type === 'srflx') found.srflxMs ??= ms;
      else if (e.candidate.type === 'relay') found.relayMs ??= ms;
      else if (e.candidate.type === 'host') found.host++;
    };
    setTimeout(resolve, 5000);
  });
  try {
    await pc.setLocalDescription(await pc.createOffer());
    await done;
  } catch {}
  pc.close();
  set({ net: { ...base, ...found, checked: true, webrtc: true } });
}

/** 邀请链接：页面在 localhost 打开时换成局域网 IP，手机扫码才能访问 */
function useKeyboardOpen() {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const vv = window.visualViewport;
    let baseline = window.innerHeight;
    let orientation = window.screen.orientation?.type;
    const update = () => {
      const next = window.screen.orientation?.type;
      if (next !== orientation) { orientation = next; baseline = window.innerHeight; }
      const editing = document.activeElement?.matches('input, textarea, [contenteditable="true"]');
      if (!editing) baseline = Math.max(baseline, window.innerHeight);
      setOpen(!!editing && baseline - (vv?.height || window.innerHeight) > 120);
    };
    for (const type of ['resize', 'focusin', 'focusout']) window.addEventListener(type, update);
    vv?.addEventListener('resize', update);
    update();
    return () => {
      for (const type of ['resize', 'focusin', 'focusout']) window.removeEventListener(type, update);
      vv?.removeEventListener('resize', update);
    };
  }, []);
  return open;
}

/** 试听：演示模式合成一段音频；真实模式嵌入 YouTube / B 站官方播放器（不下载文件） */
async function startPreview(r) {
  const prev = get().preview;
  if (prev?.id === r.id) return stopPreview();
  stopPreview();
  session.out.unlock();
  const vid = r.id.split(':')[1];
  if (!r.mock && (r.source === 'youtube' || r.source === 'ytmusic')) {
    return set({ preview: { ...r, kind: 'embed', src: `https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0` } });
  }
  if (!r.mock && r.source === 'bilibili') {
    return set({ preview: { ...r, kind: 'embed', src: `https://player.bilibili.com/player.html?bvid=${vid}&autoplay=1&high_quality=1&danmaku=0` } });
  }
  set({ preview: { ...r, kind: 'audio', loading: true } });
  const blob = await synthDemo(`${r.title}${r.artist}`, 12);
  if (get().preview?.id !== r.id) return;
  previewAudio.src = URL.createObjectURL(blob);
  previewAudio.play().catch(() => {});
  set({ preview: { ...get().preview, loading: false } });
}
const previewAudio = new Audio();
previewAudio.onended = () => set({ preview: null });
function stopPreview() {
  previewAudio.pause();
  if (previewAudio.src) URL.revokeObjectURL(previewAudio.src);
  previewAudio.removeAttribute('src');
  set({ preview: null });
}

// ════════════════════════════════════════════════════════════ Android App：启动强制更新（GitHub Releases）
// 只在 Android App 里生效（浏览器里没有"已安装版本"，直接跳过）。检查逻辑见 appUpdate.js，原生下载 / 安装见 appUpdateNative.js。
const UPDATE_REPO = HH.updateRepo || DEFAULT_REPO;
const UPDATE_MIRRORS = Array.isArray(HH.updateMirrors) ? HH.updateMirrors : []; // 可选的国内镜像前缀，如 "https://ghfast.top/"（只在能校验 SHA-256 时使用）
const updateErrorText = (e) => {
  const m = String(e?.message || e || '');
  if (/SHA-256/i.test(m)) return '下载的安装包校验失败，已丢弃。请重试，或改用浏览器下载。';
  if (/Activity not found|No application/i.test(m)) return '手机上没有可以安装 APK 的程序。请改用浏览器下载。';
  if (/timeout|timed out|UnknownHost|Unable to resolve|SocketTimeout|failed to connect|ECONN/i.test(m)) return '下载超时或网络不通（GitHub 在部分网络下很慢）。请重试，或改用浏览器下载。';
  return `下载失败：${m.slice(0, 120) || '未知错误'}`;
};

function useAppUpdate() {
  const [st, setSt] = useState({ update: null, current: '', phase: 'idle', received: 0, total: 0, source: '', error: '' });
  const patch = (p) => setSt((s) => ({ ...s, ...p }));

  useEffect(() => {
    if (!NativeUpdate.isAndroidApp()) return undefined;
    let dead = false;

    (async () => {
      try {
        const current = await NativeUpdate.getInstalledVersion();
        const result = await checkForUpdate({ repo: UPDATE_REPO, localVersion: current }); // 5 秒超时，失败 = 静默跳过
        if (dead) return;
        if (result.status !== 'update') return void NativeUpdate.cleanStaleDownloads();
        patch({ update: result.update, current });
      } catch {} // 任何意外都不能挡住用户
    })();
    return () => {
      dead = true;
    };
  }, []);

  const busy = ['downloading', 'verifying', 'installing'].includes(st.phase);
  const start = async () => {
    if (!st.update || busy) return;
    patch({ phase: 'downloading', error: '', received: 0, total: st.update.apk.size });
    try {
      await NativeUpdate.downloadAndInstall({
        update: st.update,
        mirrors: UPDATE_MIRRORS,
        onPhase: (phase, info) => patch({ phase, ...(info?.source ? { source: info.source } : {}) }),
        onProgress: (received, total) => patch({ received, total }),
      });
      patch({ phase: 'installed' }); // 系统安装界面已经打开
    } catch (e) {
      patch({ phase: 'error', error: updateErrorText(e) });
    }
  };
  const openBrowser = () => st.update && NativeUpdate.openInBrowser(st.update.apk.url).catch((e) => patch({ error: updateErrorText(e) }));
  return { ...st, busy, start, openBrowser, dismiss: () => patch({ update: null }) };
}

/** 更新提示也服从统一返回栈；关闭提示不取消已经开始的安装包下载。 */
function UpdateGate() {
  const u = useAppUpdate();
  useBackLayer(!!u.update, u.dismiss);

  useEffect(() => {
    if (!u.update) return undefined;

        e.stopPropagation();
        btn.current?.focus();
      }

    document.addEventListener('keydown', block, true);
    return () => document.removeEventListener('keydown', block, true);
  }, [!!u.update]);
  if (!u.update) return null;

  const pct = u.total > 0 ? Math.min(100, Math.round((u.received / u.total) * 100)) : 0;
  const mb = (n) => (n / 1048576).toFixed(1);

          <${ArrowRight} size=${16} class="text-sand-500" />
          <span class="rounded-lg bg-host/15 px-3 py-1.5 text-host">最新 <b>v${u.update.version}</b></span>
        </div>
      </header>

      <div id="upd-body" class="space-y-3 px-6 py-5">
        <div>
          <div class="mb-1.5 text-xs text-sand-500">更新内容</div>
          <div class="scroll-thin max-h-48 overflow-y-auto whitespace-pre-wrap break-words rounded-2xl bg-black/25 px-3.5 py-3 text-sm leading-relaxed text-sand-200">${u.update.notes || '本次更新没有填写更新日志。'}</div>
        </div>
        ${(u.busy || u.phase === 'installed') && html`<div aria-live="polite">
          <div class="h-1.5 overflow-hidden rounded-full bg-white/10"><div class="h-full rounded-full bg-host transition-[width] duration-200" style=${{ width: `${u.phase === 'downloading' ? pct : 100}%` }} /></div>
          <div class="mt-1.5 flex justify-between text-xs text-sand-500">
            <span>${u.phase === 'installed' ? '安装界面已打开' : u.source ? `来自 ${u.source}` : ''}</span>
            <span>${u.phase === 'downloading' && u.total ? `${mb(u.received)} / ${mb(u.total)} MB` : ''}</span>
          </div>
        </div>`}
        ${u.phase === 'installed' && html`<p class="rounded-xl bg-white/5 px-3 py-2 text-xs text-sand-400">按系统提示安装。如果没有出现安装界面，请在弹出的设置里允许「Half&Half」安装未知应用，然后点下面的按钮。</p>`}
        ${u.error && html`<p role="alert" class="flex gap-2 rounded-xl bg-guest/10 px-3 py-2 text-xs text-guest"><${AlertTriangle} size=${14} class="mt-0.5 shrink-0" />${u.error}</p>`}
      </div>

      <footer class="px-6 pb-6">
        <button type="button" class="mb-3 w-full text-sm text-sand-400" onClick=${u.dismiss}>稍后更新</button>
        <button ref=${btn} type="button" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-host px-4 py-3 font-semibold text-ink-950 hover:brightness-110 disabled:opacity-70" disabled=${u.busy} onClick=${u.start}>
          ${u.busy ? html`<${Loader2} size=${17} class="animate-spin" />` : html`<${Download} size=${17} />`}${label}
        </button>
        ${(u.phase === 'error' || u.phase === 'installed') && html`<button type="button" class="mt-3 flex w-full items-center justify-center gap-1.5 text-xs text-sand-500 hover:text-sand-200" onClick=${u.openBrowser}><${ExternalLink} size=${12} />改用浏览器下载</button>`}
      </footer>
    </section>
  </div>`;
}

let listeningStats = null;
let samplingListening = false;
function sampleListening(extra = {}) {
  if (!listeningStats || samplingListening) return;
  samplingListening = true;
  const s = get(), audio = session.out.audio;
  try { listeningStats.sample({ trackId: session.loadedId || s.currentId, duration: audio.duration || s.duration,
    currentTime: audio.currentTime, playing: !audio.paused && !audio.ended && audio.readyState >= 2,
    connected: s.conn === 'open' && !!session.conn?.open, friendId: session.invitation?.userId,
    seeking: audio.seeking, playbackRate: audio.playbackRate, ...extra }); } finally { samplingListening = false; }
}

function App() {

    const unsubscribe = stats.subscribe(() => set({ statsRevision: (get().statsRevision || 0) + 1 }));
    stats.ready().then(() => set({ statsRevision: (get().statsRevision || 0) + 1 })).catch(console.warn);
    const audio = session.out.audio;
    const sample = () => sampleListening();
    const ended = () => sampleListening({ ended: true });
    const events = ['playing', 'pause', 'seeking', 'seeked', 'waiting', 'timeupdate'];
    for (const event of events) audio.addEventListener(event, sample);
    audio.addEventListener('ended', ended, true);
    const timer = setInterval(sample, 1000);
    const flush = () => { sample(); stats.flush().catch(console.warn); };
    window.addEventListener('pagehide', flush);
    const unstore = store.subscribe(sample);
    return () => { sample(); stats.flush().catch(console.warn); unsubscribe(); unstore(); clearInterval(timer); for (const event of events) audio.removeEventListener(event, sample); audio.removeEventListener('ended', ended, true); window.removeEventListener('pagehide', flush); };
  }, []);

    </main>
    ${!keyboardOpen && html`<${NativePlayer} open=${playerOpen} close=${() => setPlayerOpen(false)} expand=${() => setPlayerOpen(true)} />
      <nav aria-label="主导航" class="fixed inset-x-0 bottom-0 z-40 border-t border-ink-700 bg-ink-950/95 backdrop-blur-xl" style=${{ paddingBottom: 'var(--safe-bottom, 0px)', paddingLeft: 'var(--safe-left)', paddingRight: 'var(--safe-right)' }}>
        <div class="mx-auto grid h-16 max-w-5xl grid-cols-4">${[['discover', '发现/检索', Search], ['library', '曲库/歌单', Library], ['friends', '好友/动态', Users], ['settings', '设置/账号', Settings]].map(([id, label, Icon]) => html`<button key=${id} aria-current=${tab === id ? 'page' : undefined} class=${cx('flex flex-col items-center justify-center gap-1 text-xs', tab === id ? 'text-host' : 'text-sand-400')} onClick=${() => setTab(id)}><${Icon} size=${21} />${label}</button>`)}</div>
      </nav>`}
    ${invitation && html`<div class="fixed inset-0 z-[90] grid place-items-center bg-black/70 p-5"><section role="dialog" aria-modal="true" aria-label="一起听邀请" class="w-full max-w-sm space-y-5 rounded-3xl bg-ink-900 p-6"><p>${invitation.nickname} 邀请你一起听歌，是否加入？</p><div class="flex justify-end gap-4">${[false, true].map(accept => html`<button class="rounded-xl border border-ink-600 px-5 py-3" onClick=${() => { session.out.unlock(); sendSocial({ type: 'INVITE_LISTEN_RESPONSE', inviteId: invitation.inviteId, accept }); setInvitation(null); }}>${accept ? '加入' : '暂不'}</button>`)}</div></section></div>`}
    <${PreviewDock} />
    <${Toasts} />
    <${DropOverlay} />
    <${LocalLibraryModal} />
    <${ConnSettingsModal} />
    <${CoListenDrawer} />
    <${QueueSheet} />
    <${TrackMenuSheet} />
    <${PlaylistPicker} />
    <${UpdateGate} />
  `;
}

function AppShell() {
  useEffect(() => {
    let disposed = false, remove;
    installAndroidBack({ notify: toast, navigate: () => {
      const s = get();
      if (s.preview) { stopPreview(); return true; }
      if (s.results.length || s.searching) { searchEpoch++; set({ results: [], searchMeta: null, searching: false, query: '' }); return true; }
      if (s.screen !== 'home') { set({ screen: 'home' }); return true; }
      if (s.role) { session.leave(); return true; }
      return false;
    }}).then(fn => { if (disposed) fn(); else remove = fn; }).catch(console.error);
    return () => { disposed = true; remove?.(); };
  }, []);
  useEffect(() => {
    iceReady = applyIce();
    api.init();
    // 每次打开页面：自动识别本机已保存的歌曲，然后同步账号里的昵称和歌单
    session.restoreLocal().then(() => { syncProfile(); cloudSync.sync().catch(() => {}); });
    // 空格 = 播放/暂停
    const onKey = (e) => {
      if (e.code !== 'Space' || e.repeat || e.target.closest('input, textarea, button, select')) return;
      e.preventDefault();
      session.act('toggle');
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return html`<${App} />`;
}

createRoot(document.getElementById('root')).render(html`<${AccountGate} client=${account}><${AppShell} /><//>`);
</script>
</body>
</html>
