  async download(result, onProgress) {
    await account.assertActive();
    // remote：房主电脑下载并加入它的曲库，曲库会同步过来，本机无需拿到文件
    if (viaHost() && !result.mock) {
      await rpc('download', { result }, onProgress);
      return { remote: true };
    }
    if (get().apiMode === 'auth' && !result.mock) throw new Error(AUTH_HINT);
    if (result.mock || get().apiMode !== 'live') {
      for (let p = 0; p <= 1; p += 0.08 + Math.random() * 0.08) {
        onProgress(Math.min(p, 0.95));
        await sleep(160);
      }
      onProgress(0.97);
      const blob = await synthDemo(`${result.title}${result.artist}`);
      return { blob, fileName: `${result.artist} - ${result.title}（演示音频）.wav`, demo: true };
    }
    const r = await fetch(`${API_BASE}/api/download`, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ id: result.id, format: 'm4a', ...(result.qualityId != null && { quality: result.qualityId }) }),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    let file = body.status === 'exists' ? body.entry.file : body.job?.status === 'done' ? body.job.file : null;
    if (!file) {
      file = await new Promise((resolve, reject) => {
        jobWaiters.set(result.id, (job) => {
          onProgress(job.progress || 0);
          if (job.status === 'done') resolve(job.file);
          if (job.status === 'error') reject(new Error(job.error || '下载失败'));
        });
      }).finally(() => jobWaiters.delete(result.id));
    }
    onProgress(0.99);
    const fr = await fetch(`${API_BASE}/files/${encodeURIComponent(file)}`, { headers: authHeaders() });
    if (!fr.ok) throw new Error(`读取文件失败 HTTP ${fr.status}`);
    return { blob: await fr.blob(), fileName: file };
  },
};

// ════════════════════════════════════════════════════════════ 时钟同步 & 漂移控制
// NTP 式：offset = ((t1 − t0) + (t2 − t3)) / 2，取 RTT 最低的 1/4 样本的中位数
class Clock {
  samples = [];
  offset = 0;
  rtt = 0;
  ready = false;
  handlePong({ t0, t1, t2 }) {
    const t3 = now();
    this.samples.push({ rtt: t3 - t0 - (t2 - t1), offset: (t1 - t0 + (t2 - t3)) / 2 });
    if (this.samples.length > 30) this.samples.shift();
    const byRtt = [...this.samples].sort((a, b) => a.rtt - b.rtt);
    const best = byRtt.slice(0, Math.max(1, Math.ceil(byRtt.length / 4))).map((s) => s.offset).sort((a, b) => a - b);
    this.offset = best[best.length >> 1];
    this.rtt = byRtt[byRtt.length >> 1].rtt;
    this.ready = this.samples.length >= 3;
  }
  toLocal = (h) => h - this.offset;
  toHost = (l) => l + this.offset;
}

// 偏差 < 0.3s 微调 playbackRate（preservesPitch 不变调），≥ 0.5s 直接 seek；中位数滤波 + 迟滞防抖
class DriftController {
  samples = [];
  correcting = false;
  lastSeek = -1e9;
  reset() {
    this.samples = [];
    this.correcting = false;
  }
  update(drift, t) {
    this.samples.push(drift);
    if (this.samples.length > 3) this.samples.shift();
    const d = [...this.samples].sort((a, b) => a - b)[this.samples.length >> 1];
    const abs = Math.abs(d);
    if (abs >= 0.5 && this.samples.length >= 2 && t - this.lastSeek > 3000) {
      this.lastSeek = t;
      this.reset();
      return { action: 'seek', rate: 1, drift: d };
    }
    if (abs <= (this.correcting ? 0.01 : 0.02)) {
      this.correcting = false;
      return { action: 'rate', rate: 1, drift: d };
    }
    this.correcting = true;
    return { action: 'rate', rate: 1 - Math.max(-0.05, Math.min(0.05, d / 4)), drift: d };
  }
}

// ════════════════════════════════════════════════════════════ 音频引擎（HTML5 Audio + Web Audio 分析）
class AudioOut {
  audio = new Audio();
  ctx = null;
  gain = null;
  analyser = null;
  intent = false; // 应该在播放（等待调度时刻时 audio.paused 为 true）
  pausedAt = 0;
  target = null;
  url = null;
  onEnded = null;
  onBlocked = null;

  constructor() {
    this.audio.preload = 'auto';
    this.audio.preservesPitch = true;
    this.audio.addEventListener('ended', () => {
      if (!this.intent) return;
      this.intent = false;
      this.onEnded?.();
    });
  }

  /** 必须在用户手势中调用：创建 AudioContext 并接入分析器（频谱动画） */
  unlock() {
    // Android uses the media pipeline directly; a suspended analyser must not mute playback.
    if (isAndroid) { this.audio.volume = get().volume; return; }
    if (!this.ctx) {
      try {
        this.ctx = new AudioContext();
        const src = this.ctx.createMediaElementSource(this.audio);
        this.gain = this.ctx.createGain();
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 64;
        src.connect(this.gain).connect(this.analyser).connect(this.ctx.destination);
        this.gain.gain.value = get().volume;
        this.audio.volume = 1;
      } catch (e) {
        console.warn('Web Audio 不可用，退回纯 HTML5 Audio', e);
      }
    }
    this.ctx?.resume().catch(() => {});
    if (navigator.audioSession) navigator.audioSession.type = 'playback'; // iOS 静音拨片下也出声
  }

  setVolume(v) {
    if (this.gain) this.gain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.02);
    else this.audio.volume = v;
  }

  get latency() {
    return this.ctx ? (this.ctx.outputLatency || 0) + (this.ctx.baseLatency || 0) : 0;
  }

  load(blob, { autoplay = false } = {}) {
    clearTimeout(this.timer);
    this.intent = false;
    this.pausedAt = 0;
    this.audio.pause();
    if (this.url) URL.revokeObjectURL(this.url);
    this.url = URL.createObjectURL(blob);
    const loaded = new Promise((resolve, reject) => {
      this.audio.onloadedmetadata = () => resolve(this.audio.duration);
      this.audio.onerror = () => reject(new Error('浏览器无法解码该音频'));
    });
    this.audio.src = this.url;
    this.audio.currentTime = 0;
    // Solo playback must continue in the ended event, before metadata/bridge/timers.
    if (autoplay) this.playAt(now(), 0);
    return loaded;
  }

  /** 在本地时刻 localMs 让听到的位置为 pos；已过去则直接跳到"现在应在的位置" */
  playAt(localMs, pos) {
    clearTimeout(this.timer);
    this.intent = true;
    this.target = { localMs, pos };
    this.audio.playbackRate = 1;
    const start = () => {
      this.audio.currentTime = Math.max(0, pos + (now() - localMs) / 1000 + this.latency);
      const source = this.audio.src;
      this.audio.play().catch((e) => {
        if (this.audio.src !== source || !this.intent || e.name === 'AbortError') return;
        this.intent = false;
        if (e.name === 'NotAllowedError') this.onBlocked?.();
        this.onPlayError?.(e);
      });
    };
    const wait = localMs - now();
    if (wait > 8) this.timer = setTimeout(start, wait);
    else start();
  }

  stopAt(localMs, pos) {
    clearTimeout(this.timer);
    this.intent = false;
    this.pausedAt = pos;
    const stop = () => {
      this.audio.pause();
      if (this.audio.readyState) this.audio.currentTime = pos;
    };
    const wait = localMs - now();
    if (wait > 8) this.timer = setTimeout(stop, wait);
    else stop();
  }

  setRate(r) {
    this.audio.playbackRate = r;
  }

  position() {
    if (!this.intent) return this.pausedAt;
    if (this.audio.paused && this.target) return this.target.pos + (now() - this.target.localMs) / 1000;
    return this.audio.currentTime - this.latency;
  }
}

// ════════════════════════════════════════════════════════════ 会话引擎（PeerJS 双人同步）
// 协议（DataChannel，Host 为唯一权威；Guest 的操作以 req 发给 Host 裁决后广播）
//   hello{name,color}  ping{t0,rtt}/pong{t0,t1,t2}  library{items,currentId}
//   track{meta,by,quiet}  need{id}  ready{id}
//   file-begin{id,size,mime,meta?,upload?}  file-chunk{id,data}  file-end{id}
//   play|pause|seek{trackId,playing,position,at,by,quiet}   state{…锚点}（每秒心跳）
//   req{action,position?,itemId?}   full
class Session {
  out = new AudioOut();
  clock = new Clock();
  drift = new DriftController();
  peer = null;
  conn = null;
  blobs = new Map(); // id → Blob（内存里的音频：Host 新加入的歌 / Guest 最近收到的缓存 / 从本机曲库读出的最近几首）
  localLoaded = []; // 从 IndexedDB 读进内存的曲目 id（LRU，避免几百首歌全部常驻内存）
  pendingSaves = new Set(); // Guest：等待房主发来、收到后存入本机的曲目 id
  prefetching = new Set(); // Guest：已经请房主预先发来的下一首 id
  queue = new PlayQueue({ mode: get().playMode }); // 播放顺序（随机 / 循环）只在 Host / 单人端计算
  forceResync = false; // Guest 从后台回来：下一条状态直接硬对齐，不走渐进微调
  hiddenAt = 0;
  lastRx = 0; // 最近一次收到对方任何消息的时刻（心跳 / 状态 / 文件分片都算）
  peerBg = false; // 对方告知已切到后台
  rc = null; // Guest 自动重连状态 { since, attempt, timer, dialTimer }
  guestClientId = null; // Host：当前 Guest 的设备 id
  byeReceived = false; // 对方是主动离开（不是掉线）
  statsTimer = null;
  joinTimer = null;
  incoming = new Map(); // id → { chunks, received, size, mime, meta, upload }
  anchor = { trackId: null, playing: false, position: 0, at: 0 };
  loadedId = null;
  token = 0;
  sendGen = 0;
  peerRtt = 0;
  autoplay = null;
  lastPing = 0;

  constructor() {
    this.out.onEnded = () => this.onEnded();
    this.out.onBlocked = () => note('浏览器拦截了自动播放，点一下页面任意位置即可出声', 'warn');
    this.out.onPlayError = (e) => {
      this.anchor.playing = false;
      set({ playing: false, playbackPending: false });
      console.warn('音频播放失败', e);
      toast(`音频播放失败：${e.message}`, 'warn');
    };
    setInterval(() => this.tick(), HEARTBEAT_MS);
    // 自动播放策略：页面上的第一次（以及之后每次）点击都顺手解锁音频
    for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, () => this.out.unlock(), { capture: true });
    // 切后台 / 锁屏后回来：重新测时钟、硬对齐进度、恢复被系统打断的播放
    document.addEventListener('visibilitychange', () => {
      this.send({ type: 'bg', hidden: document.hidden }); // 告诉对方：我切后台了，别把我的沉默当掉线
      if (document.hidden) this.hiddenAt = now();
      else this.onResume();
    });
    window.addEventListener('pageshow', (e) => e.persisted && this.onResume()); // 从 bfcache 恢复
  }

  /**
   * 页面重新可见。
   * Guest：后台期间计时器被节流、时钟样本过期，播放进度可能已经偏了几百毫秒到几秒；
   *        先连发一组 ping 重新测量 RTT / 时钟偏移，再请房主立即发一次状态，收到后直接跳到正确位置。
   *        如果连接在后台断了（iOS 锁屏久了常见），用同一个房间码自动重新加入。
   * Host / 单人：来电、别的 App 抢占音频会让系统暂停 <audio>，但我们的状态仍是"播放中"，在这里接着播。
   */
  async onResume() {
    const away = this.hiddenAt ? (now() - this.hiddenAt) / 1000 : 0;
    this.hiddenAt = 0;
    this.lastRx = now(); // 自己在后台时计时器被节流，回来先不急着判定对方掉线
    // iOS 锁屏会挂起 AudioContext；音频经 MediaElementSource 输出时必须恢复，否则"在播放但没声音"
    if (this.out.ctx && this.out.ctx.state !== 'running') this.out.ctx.resume().catch(() => this.out.onBlocked?.());
    if (this.isGuest) {
      if (!this.conn?.open) {
        if (get().roomCode && !this.rc) this.reconnect('在后台断开');
        return;
      }
      this.drift.reset();
      await this.burstPings();
      this.forceResync = away;
      this.send({ type: 'sync' });
      return;
    }
    const a = this.out.audio;
    if (this.loadedId && this.out.intent && a.paused && now() > (this.out.target?.localMs ?? 0) + 200) {
      this.resumeFrom(a.currentTime);
      note('播放被系统打断，已自动继续', 'sync');
    }
  }

  /** Host / 单人：从 pos 立即（带提前量）继续播放，并通知对方 */
  resumeFrom(pos) {
    if (pos === 0) this.out.audio.currentTime = 0;
    const lead = this.conn?.open ? Math.min(1000, Math.max(120, this.peerRtt * 1.5 + 60)) : 0;
    const anchor = { trackId: this.loadedId, playing: true, position: pos, at: now() + lead };
    this.applyAnchor(anchor);
    this.send({ type: 'play', ...anchor, by: 'host', quiet: true });
  }

  /** 播放范围：正在播放的歌单（按歌单顺序），没有选歌单时是整个曲库 */
  scopeIds() {
    const id = get().activePlaylistId;
    return resolveScope(id ? playlistStore.get(id) : null, get().library);
  }

  /** 当前曲目 + 播放范围 → 播放队列（增量对齐） */
  syncQueue() {
    return this.queue.setTracks(this.scopeIds(), get().currentId);
  }

  /** 房主 / 单人当前播放的歌单（给 Guest 和房间横幅用） */
  playlistInfo() {
    const pl = get().activePlaylistId && playlistStore.get(get().activePlaylistId);
    return pl ? { id: pl.id, name: pl.name, ids: this.scopeIds() } : null;
  }

  /**
   * 播放一个歌单：队列立即换成这个歌单的全部曲目（随机模式重新洗牌），从 startItemId 或第一首开始。
   * 单人：直接播；房主在房间里：同时向 Guest 广播 set_playlist，对方横幅显示"正在一起收听歌单"。
   */
  async playPlaylist(playlistId, { startItemId = null } = {}) {
    if (this.isGuest) return toast('房间里的歌单由房主决定：双击歌曲可以请房主切过去', 'warn');
    const pl = playlistId && playlistId !== ALL_ID ? playlistStore.get(playlistId) : null;
    if (playlistId && playlistId !== ALL_ID && !pl) return toast('这个歌单已经不存在了', 'warn');
    if (pl) await ensureInLibrary(missingFromLibrary(pl, get().library));
    set({ activePlaylistId: pl ? pl.id : null });
    const scope = this.scopeIds();
    if (!scope.length) return toast(pl ? `歌单《${pl.name}》里还没有歌` : '曲库里还没有歌', 'warn');
    const q = this.queue = new PlayQueue({ mode: get().playMode });
    q.setTracks(scope, null);
    if (q.mode === 'shuffle') q.newRound();
    const target = startItemId && scope.includes(startItemId) ? startItemId : q.peekNext() || scope[0];
    this.announcePlaylist();
    await this.loadTrack(target, { autoplay: true, via: 'select' });
    this.notifySynced();
  }

  /** 房主：告诉 Guest 现在播放哪个歌单（随带最新曲库，保证双方队列一致） */
  announcePlaylist() {
    if (this.isGuest || !this.conn?.open) return;
    this.send({ type: 'set_playlist', playlist: this.playlistInfo(), items: get().library });
  }

  /** 切换播放模式：只有 Host / 单人可以改，改完随歌单广播给 Guest */
  setPlayMode(mode) {
    if (this.isGuest) return toast('播放模式由房主控制', 'warn');
    this.syncQueue().setMode(mode);
    set({ playMode: this.queue.mode });
    try { localStorage.setItem('hh.playMode', this.queue.mode); } catch {}
    this.broadcastLibrary();
    this.notifySynced();
    if (!this.conn?.open) toast(MODE_LABEL[this.queue.mode]);
  }

  get isGuest() {
    return get().role === 'guest';
  }

  // ───────────────────────── 房间
  async joinInvitation(info, ready) {
    this.stopReconnect();
    clearTimeout(this.joinTimer);
    this.destroyPeer();
    this.invitation = info;
    await syncProfile();
    await account.assertActive();
    await applyIce();
    if (this.invitation !== info) return;
    this.out.unlock();
    if (info.role === 'guest') { this.out.stopAt(now(), 0); this.loadedId = null; }
    set({ role: info.role, conn: 'connecting', roomCode: null, peerReady: false,
      ...(info.role === 'guest' ? { library: [], currentId: null, loaded: false } : {}) });
    const peer = this.peer = new Peer(info.peerId, peerOptions());
    let announced = false;
    peer.on('open', () => { if (this.peer !== peer) return; if (info.role === 'host') { if (!announced) { announced = true; ready(info.sessionId); } } else if (this.invitationReady === info.sessionId) this.dialInvitation(); });
    peer.on('connection', c => {
      if (this.peer !== peer || info.role !== 'host' || c.peer !== info.remotePeerId || c.metadata?.ticket !== info.ticket || c.metadata?.sessionId !== info.sessionId) return c.close();
      if (this.conn?.open) {
        if (now() - this.lastRx <= (this.peerBg ? BG_STALE_MS : STALE_MS)) return c.close();
        const old = this.conn; this.conn = null; old.close();
      }
      c.reconnected = this.guestClientId === c.metadata?.clientId;
      this.guestClientId = c.metadata?.clientId || null;
      this.bind(c);
    });
    peer.on('disconnected', () => this.peer === peer && !peer.destroyed && peer.reconnect());
    peer.on('error', e => this.peerError(e));
    this.joinTimer = setTimeout(() => {
      if (this.invitation !== info || this.conn?.open) return;
      this.leave();
      toast('一起听连接超时，请检查网络或重新邀请', 'warn');
    }, 20000);
  }

  dialInvitation() {
    const info = this.invitation;
    if (!info || info.role !== 'guest' || this.invitationReady !== info.sessionId || !this.peer?.open || this.conn) return;
    const c = this.peer.connect(info.remotePeerId, { reliable: true, serialization: 'binary', metadata: { clientId: CLIENT_ID, ticket: info.ticket, sessionId: info.sessionId } });
    this.bind(c);
    return c;
  }

  async createRoom() {
    try { await account.assertActive(); } catch (e) { return toast(e.message, 'warn'); }
    this.out.unlock();
    await iceReady;
    this.destroyPeer();
    const code = String(Math.floor(100000 + Math.random() * 900000));
    set({ role: 'host', conn: 'opening', roomCode: null, joinError: null });
    const peer = (this.peer = new Peer(PEER_PREFIX + code, peerOptions()));
    peer.on('open', () => set({ roomCode: code, conn: 'waiting' }));
    peer.on('connection', async (c) => {
      try { await account.verifyPeer(c.metadata?.ticket, code); } catch { c.close(); return; }
      if (this.peer !== peer) { c.close(); return; }
      const cid = c.metadata?.clientId || null;
      if (this.conn?.open) {
        // 同一台设备重连（它那边已经判定掉线），或者旧连接已经静默：用新连接替换旧连接
        const same = cid && cid === this.guestClientId;
        const stale = now() - this.lastRx > (this.peerBg ? BG_STALE_MS : STALE_MS);
        if (!same && !stale) {
          c.on('open', () => c.send({ type: 'full' }));
          return setTimeout(() => c.close(), 800);
        }
        const old = this.conn;
        this.conn = null;
        old.close();
      }
      c.reconnected = !!cid && cid === this.guestClientId;
      this.guestClientId = cid;
      this.bind(c);
    });
    // 与信令服务器断开（P2P 不受影响），自动重连；主动离开时 peer 已销毁，不能再重连
    peer.on('disconnected', () => this.peer === peer && !peer.destroyed && peer.reconnect());
    peer.on('error', (e) => {
      if (e.type === 'unavailable-id') return this.createRoom(); // 房间码撞车，换一个
      this.peerError(e);
    });
  }

  async joinRoom(code) {
    try { await account.assertActive(); } catch (e) { return toast(e.message, 'warn'); }
    code = String(code).trim();
    if (!/^\d{6}$/.test(code)) return toast('同听会话无效', 'warn');
    this.out.unlock();
    await iceReady;
    this.destroyPeer();
    set({ role: 'guest', conn: 'connecting', roomCode: code, library: [], currentId: null });
    this.stopReconnect();
    this.createGuestPeer(code, () => this.dial(code));
    // PeerJS 在 ICE 打不通时不会报错，只是一直不 open：给一个明确的超时和下一步建议
    clearTimeout(this.joinTimer);
    this.joinTimer = setTimeout(() => {
      if (get().role !== 'guest' || get().conn !== 'connecting') return;
      this.leave();
      set({ joinError: `握手超时：两台设备之间打不通。不同网络 / 跨境请在「连接设置」里配置 TURN 中继${get().ice?.turn ? '（已配置的 TURN 也没连上，检查凭证）' : ''}` });
    }, 15000);
  }

  createGuestPeer(code, onOpen) {
    const peer = (this.peer = new Peer(peerOptions()));
    peer.on('open', onOpen);
    peer.on('disconnected', () => this.peer === peer && !peer.destroyed && peer.reconnect());
    peer.on('error', (e) => {
      if (this.rc) return this.scheduleReconnect(); // 重连期间：房主暂时不在 / 网络抖动，继续重试
      if (e.type === 'peer-unavailable') {
        this.leave();
        return set({ joinError: `房间 ${code} 不存在或房主已离开` });
      }
      this.peerError(e);
      if (get().role !== 'guest') set({ joinError: '连接失败，请检查网络后重试' });
    });
    return peer;
  }

  async dial(code) {
    let ticket;
    try { ticket = await account.peerTicket(code); } catch (e) { this.leave(); toast(e.message, 'warn'); return; }
    if (!this.peer || this.peer.destroyed) return;
    const c = this.peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'binary', metadata: { clientId: CLIENT_ID, ticket } });
    this.bind(c);
    return c;
  }

  /**
   * Guest 无感重连：保留角色、歌单、正在播放的音乐（本地继续按最后的锚点播放），
   * 后台用同一房间码重新拨号，指数退避（0.3s → 1s → 2s → 4s → 8s），90 秒内一直尝试。
   * 连上后先重新测时钟，再向房主要一次状态硬对齐。
   */
  reconnect(reason) {
    if (!this.isGuest || (!get().roomCode && !this.invitation)) return;
    const old = this.conn;
    this.conn = null;
    clearInterval(this.statsTimer);
    try { old?.close(); } catch {}
    if (this.rc) return;
    this.rc = { since: now(), attempt: 0, timer: null, dialTimer: null };
    set({ conn: 'reconnecting', peerReady: false, transfer: null, link: null });
    note(`连接${reason}，正在自动重连…`, 'warn');
    this.scheduleReconnect(300);
  }

  scheduleReconnect(delay) {
    const rc = this.rc;
    if (!rc || rc.timer) return;
    clearTimeout(rc.dialTimer);
    if (now() - rc.since > 90_000) {
      this.stopReconnect();
      set({ conn: 'idle' });
      return toast('自动重连失败：房主可能已离开，或网络长时间不通。可以在主界面重新加入', 'warn');
    }
    rc.timer = setTimeout(() => {
      rc.timer = null;
      if (this.rc !== rc || this.conn?.open) return;
      rc.attempt++;
      const code = get().roomCode;
      const go = () => {
        if (this.rc !== rc) return;
        const c = this.invitation ? (this.conn || this.dialInvitation()) : this.dial(code);
        rc.dialTimer = setTimeout(() => {
          if (c && this.conn === c && !c.open) {
            this.conn = null;
            c.close();
            this.scheduleReconnect();
          }
        }, 8000);
      };
      if ((!this.peer || this.peer.destroyed) && this.invitation) {
        const info = this.invitation;
        const peer = this.peer = new Peer(info.peerId, peerOptions());
        peer.on('open', go);
        peer.on('error', () => this.scheduleReconnect());
      }
      else if (!this.peer || this.peer.destroyed) this.createGuestPeer(code, go);
      else if (this.peer.disconnected) {
        this.peer.once('open', go);
        try { this.peer.reconnect(); } catch {
          if (this.invitation) { this.peer.destroy(); this.peer = null; this.scheduleReconnect(); }
          else this.createGuestPeer(code, go);
        }
      } else go();
    }, delay ?? Math.min(8000, 500 * 2 ** rc.attempt));
  }

  stopReconnect() {
    if (!this.rc) return;
    clearTimeout(this.rc.timer);
    clearTimeout(this.rc.dialTimer);
    this.rc = null;
  }

  /** 读取 WebRTC 统计：实际走的是局域网直连、P2P 打洞，还是 TURN 中继 */
  async pollPath(c) {
    const pc = c.peerConnection;
    if (!pc || this.conn !== c) return;
    try {
      const stats = await pc.getStats();
      let pair = null;
      stats.forEach((x) => {
        if (x.type === 'transport' && x.selectedCandidatePairId) pair = stats.get(x.selectedCandidatePairId);
      });
      if (!pair) stats.forEach((x) => { if (x.type === 'candidate-pair' && x.nominated && x.state === 'succeeded') pair ??= x; });
      if (!pair) return;
      const l = stats.get(pair.localCandidateId);
      const r = stats.get(pair.remoteCandidateId);
      const relay = l?.candidateType === 'relay' || r?.candidateType === 'relay';
      const lan = !relay && l?.candidateType === 'host' && r?.candidateType === 'host';
      set({ link: { kind: relay ? 'relay' : lan ? 'lan' : 'p2p', rtt: pair.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) : null, protocol: l?.relayProtocol || l?.protocol } });
    } catch {}
  }

  /** 曲目音频：内存里没有就从本机曲库读（恢复的曲库是懒加载的） */
  async blobFor(id) {
    if (this.blobs.has(id)) return this.blobs.get(id);
    const item = get().library.find((x) => x.id === id);
    if (!item?.localId) return null;
    const blob = await LocalLib.getBlob(item.localId).catch(() => null);
    if (!blob) return null;
    this.blobs.set(id, blob);
    this.localLoaded = [...this.localLoaded.filter((x) => x !== id), id];
    while (this.localLoaded.length > 6) {
      const old = this.localLoaded.shift();
      if (old !== get().currentId && old !== this.anchor.trackId) this.blobs.delete(old);
    }
    return blob;
  }

  /** 打开页面 / 离开别人的房间后：用本机曲库重建播放列表（只读元数据，音频按需加载） */
  async restoreLocal() {
    let tracks;
    try {
      tracks = await LocalLib.listTracks({ sort: 'addedAt', order: 'asc' });
    } catch (e) {
      set({ offline: { ...get().offline, ready: true, error: e.message } });
      return console.warn('[library]', e);
    }
    // 歌单：第一次启动时把已有的歌全部并入「默认曲库」，并清掉指向已删除歌曲的引用
    await playlistStore.load(tracks.map((t) => t.id)).catch((e) => console.warn('[playlists]', e));
    if (this.isGuest) return; // 恢复期间已经加入了别人的房间：曲库以房主为准
    const items = await Promise.all(tracks.map(async (t) => fromLocal(t, await LocalLib.coverUrl(t))));
    const known = new Set(get().library.map((x) => x.hash).filter(Boolean));
    const add = items.filter((x) => !known.has(x.hash));
    if (add.length) {
      set((s) => ({ library: [...add, ...s.library] }));
      this.broadcastLibrary();
      if (!get().currentId) this.loadTrack(get().library[0].id);
    }
    await refreshOffline();
  }

  leave() {
    const wasGuest = this.isGuest;
    this.send({ type: 'bye' });
    this.stopReconnect();
    clearTimeout(this.joinTimer);
    clearInterval(this.statsTimer);
    this.peerBg = false;
    this.guestClientId = null;
    set({ link: null, peerAway: false });
    this.destroyPeer();
    set({ role: null, roomCode: null, conn: 'idle', peer: null, ping: null, peerReady: false, transfer: null, screen: 'home', coListenOpen: false, queueSheetOpen: false });
    if (wasGuest) {
      // 曲库属于房主，离开后清空；本地缓存的音频也一并释放
      this.out.stopAt(now(), 0);
      this.blobs.clear();
      this.pendingSaves.clear();
      this.loadedId = null;
      set({ library: [], currentId: null, loaded: false, playing: false, duration: 0 });
      this.restoreLocal(); // 回到自己的本机曲库
      const mode = (() => { try { return localStorage.getItem('hh.playMode') || 'order'; } catch { return 'order'; } })();
      this.queue = new PlayQueue({ mode });
      set({ playMode: mode, upNext: null, canNext: false });
    }
  }

  destroyPeer() {
    this.invitation = null;
    this.invitationReady = null;
    // 先解除引用再关闭：PeerJS 会同步触发 close 事件，避免主动离开也弹出"连接已断开"
    const { conn, peer } = this;
    this.peer = this.conn = null;
    // 稍等一下再关：让刚发出的 bye 有机会送达
    setTimeout(() => { conn?.close(); peer?.destroy(); }, conn?.open ? 250 : 0);
  }

  peerError(e) {
    console.warn('[peer]', e.type, e);
    const msg = { network: '无法连接 PeerJS 信令服务器', 'server-error': 'PeerJS 服务器错误', 'browser-incompatible': '浏览器不支持 WebRTC' }[e.type];
    toast(msg || `连接错误：${e.type}`, 'warn');
    if (e.type === 'browser-incompatible') return this.leave();
    // 信令服务器连不上：已经建立的 P2P 不受影响，只有还没连上时才退出
    if (['network', 'server-error'].includes(e.type) && !this.conn?.open) this.leave();
  }

  bind(c) {
    const invitation = this.invitation;
    this.conn = c;
    this.byeReceived = false;
    let opened = false;
    const onOpen = async () => {
      if (opened) return;
      opened = true;
      if (account.required && !this.isGuest) {
        try { c.send({ type: 'account-admission', ticket: invitation ? invitation.ticket : await account.peerTicket(get().roomCode), sessionId: invitation?.sessionId }); }
        catch (e) { c.close(); toast(e.message, 'warn'); return; }
      }
      if (this.conn !== c) return c.close(); // 已经被更新的连接取代
      const wasReconnect = this.isGuest ? !!this.rc : c.reconnected;
      this.stopReconnect();
      clearTimeout(this.joinTimer);
      this.lastRx = now();
      this.peerBg = false;
      // 连上后自动进入播放台（重连时不打断用户正在看的页面）
      set({ conn: 'open', joinError: null, peerAway: false, ...(!wasReconnect && { screen: 'deck' }) });
      if (wasReconnect) note(this.isGuest ? '已重新连接，正在校准同步…' : `${get().peer?.name || '对方'} 已重新连接`, 'sync');
      else toast(this.isGuest ? '已加入同听，开始同步' : '伙伴已加入 🎧');
      clearInterval(this.statsTimer);
      this.statsTimer = setInterval(() => this.pollPath(c), 3000);
      setTimeout(() => this.pollPath(c), 800);
      this.send({ type: 'hello', ...get().me, clientId: CLIENT_ID });
      if (this.isGuest) {
        // 重连后：先重新测时钟，再要一次状态硬对齐（期间本地一直按旧锚点在播）
        this.burstPings().then(() => {
          if (!wasReconnect || this.conn !== c) return;
          this.forceResync = 0;
          this.send({ type: 'sync' });
        });
        if (viaHost()) rpc('health').then((h) => set({ sources: h.sources })).catch((e) => note(e.message, 'warn'));
      }
      else {
        this.broadcastLibrary();
        const cur = get().library.find((x) => x.id === get().currentId);
        if (cur) {
          this.send({ type: 'track', meta: cur, by: 'host', quiet: true });
          this.send({ type: 'state', ...this.anchor });
        }
      }
    };
    c.on('open', onOpen);
    if (c.open) queueMicrotask(onOpen);
    let admitted = !account.required || !this.isGuest, pending = [], verifying = false;
    c.on('data', async (m) => {
      if (this.conn !== c) return;
      if (!admitted) {
        if (m?.type === 'account-admission' && !verifying) {
          verifying = true;
          try {
            if (invitation) {
              if (c.peer !== invitation.remotePeerId || m.ticket !== invitation.ticket || m.sessionId !== invitation.sessionId) throw new Error('会话授权无效');
            } else await account.verifyPeer(m.ticket, get().roomCode);
            if (this.conn !== c) return;
            admitted = true;
            for (const message of pending) this.onMessage(message);
            pending = [];
          } catch { c.close(); }
        } else if (pending.length < 64) pending.push(m);
        else c.close();
        return;
      }
      this.lastRx = now();
      if (get().peerAway && m.type !== 'bg') set({ peerAway: false });
      this.onMessage(m);
    });
    c.on('close', () => {
      if (this.conn !== c) return;
      this.conn = null;
      clearInterval(this.statsTimer);
      set({ link: null });
      const name = get().peer?.name || '对方';
      if (this.isGuest) {
        if (this.byeReceived) {
          toast('房主关闭了房间', 'warn');
          return this.leave();
        }
        return this.reconnect('断开'); // 音乐继续按本地锚点播放，后台重连
      }
      set({ conn: 'waiting', peerReady: false, transfer: null, peerAway: false });
      if (this.byeReceived) {
        toast(`${name} 离开了房间`, 'warn');
        set({ peer: null, ping: null });
        this.guestClientId = null;
      } else note(`${name} 断线了，等待 Ta 自动重连…`, 'warn');
    });
    c.on('error', (e) => console.warn('[conn]', e));
  }

  send(msg) {
    if (this.conn?.open) this.conn.send(msg);
  }

  notifySynced() {
    if (this.isGuest || !this.conn?.open) return;
    const id = this.pendingNotice = crypto.randomUUID();
    this.send({ type: 'sync_notice', id });
  }

  async burstPings() {
    for (let i = 0; i < 8 && this.conn?.open; i++) {
      this.send({ type: 'ping', t0: now(), rtt: this.clock.rtt });
      await sleep(120);
    }
  }

  onMessage(m) {
    const host = !this.isGuest;
    switch (m.type) {
      case 'sync_notice':
        this.send({ type: 'sync_ack', id: m.id });
        return;
      case 'sync_ack':
        if (this.pendingNotice === m.id) { this.pendingNotice = null; toast('已同步至对方'); }
        return;
      case 'hb':
        return;
      case 'bg':
        this.peerBg = !!m.hidden;
        set({ peerAway: !!m.hidden });
        if (m.hidden) note(`${get().peer?.name || '对方'} 切到了后台`);
        return;
      case 'bye':
        this.byeReceived = true;
        return;
      case 'hello':
        if (!host) rememberRoom(get().roomCode, String(m.name)); // "快速重新连接"记忆
        return set({ peer: { name: String(m.name || this.invitation?.nickname || '好友').slice(0, 16), color: m.color } });
      case 'full':
        toast('房间已满（仅限两人）', 'warn');
        return this.leave();
      case 'ping':
        this.peerRtt = m.rtt || this.peerRtt;
        // Each side measures its own data-channel RTT from pong.
        return this.send({ type: 'pong', t0: m.t0, t1: now(), t2: now() });
      case 'pong':
        this.clock.handlePong(m);
        return set({ ping: Math.round(this.clock.rtt) });
      case 'library':
        if (!host) {
          const prevMode = get().playMode;
          set({ library: m.items, currentId: m.currentId, upNext: m.upNext ?? null, canNext: m.canNext ?? true, roomPlaylist: m.playlist ?? null, ...(m.playMode && { playMode: m.playMode }) });
          if (m.playMode && m.playMode !== prevMode && get().conn === 'open') note(`${get().peer?.name || '房主'} 切换为${MODE_LABEL[m.playMode]}`);
          this.prefetchNext();
        }
        return;
      case 'set_playlist': // 房主开始播放一个歌单
        if (!host) {
          set({ roomPlaylist: m.playlist || null, ...(Array.isArray(m.items) && { library: m.items }) });
          if (m.playlist) note(`${get().peer?.name || '房主'} 开始和你一起听歌单《${m.playlist.name}》`, 'sync');
        }
        return;
      case 'prefetch': // Guest 想提前缓存队列里的下一首
        if (host) this.blobFor(m.id).then((b) => b && this.sendFile(m.id, b, { prefetch: true }));
        return;
      case 'sync': // Guest 从后台回来，要一次最新状态
        if (host && this.loadedId) this.send({ type: 'state', ...this.stateMsg() });
        return;
      case 'track':
        if (!host) this.guestTrack(m);
        return;
      case 'need':
        if (host && m.id === this.anchor.trackId) this.blobFor(m.id).then((b) => this.sendFile(m.id, b));
        return;
      case 'fetch': // Guest 想把这首存到它自己的设备上
        if (host) this.blobFor(m.id).then((b) => this.sendFile(m.id, b, { save: true }));
        return;
      case 'ready':
        if (host && m.id === this.anchor.trackId) {
          set({ peerReady: true, transfer: null });
          if (this.autoplay?.id === m.id) this.startAutoplay();
        }
        return;
      case 'file-begin':
        this.incoming.set(m.id, { chunks: [], received: 0, size: m.size, mime: m.mime, meta: m.meta, upload: m.upload, save: m.save, prefetch: m.prefetch });
        return;
      case 'file-chunk': {
        const f = this.incoming.get(m.id);
        if (!f) return;
        f.chunks.push(m.data);
        f.received += m.data.byteLength;
        if (f.received === f.size || f.chunks.length % 16 === 0) {
          const label = f.upload ? `接收 ${get().peer?.name || '对方'} 分享的歌曲` : f.save ? '保存到本机' : f.prefetch ? '预缓存下一首' : '接收音频';
          set({ transfer: { dir: 'recv', pct: f.received / f.size, label } });
        }
        return;
      }
      case 'file-end':
        return this.fileDone(m.id);
      case 'play':
      case 'pause':
      case 'seek':
        if (host) return;
        this.drift.reset();
        this.applyAnchor(m);
        if (m.by === 'host' && !m.quiet) this.noteAction(m.type, m.position);
        return;
      case 'state':
        if (!host) this.onState(m);
        return;
      case 'rpc':
        if (host) handleRpc(m);
        return;
      case 'rpc-progress':
      case 'rpc-result':
        if (!host) onRpcReply(m);
        return;
      case 'req':
        if (host) this.act(m.action, { position: m.position, itemId: m.itemId, by: 'guest' });
        return;
    }
  }

  // ───────────────────────── 操作入口（双方都能操作：Guest 发请求，Host 执行并广播）
  act(action, opts = {}) {
    this.out.unlock();
    if (action === 'toggle') action = this.anchor.playing ? 'pause' : 'play';
    if (this.isGuest && !opts.by) return this.send({ type: 'req', action, position: opts.position, itemId: opts.itemId });
    const by = opts.by || 'host';
    if (action === 'select') return this.loadTrack(opts.itemId, { autoplay: true, by, via: 'select' });
    if (action === 'next' || action === 'prev') {
      if (action === 'prev' && this.position() > 3) { this.transport('seek', 0, by); this.notifySynced(); return; }
      const q = this.syncQueue();
      const target = action === 'next' ? q.peekNext() : q.peekPrev();
      if (target) this.loadTrack(target, { autoplay: true, by, via: action }).then(() => this.notifySynced());
      return;
    }
    this.transport(action, opts.position, by);
  }

  transport(action, position, by, quiet = false) {
    if (!this.loadedId) return;
    const lead = this.conn?.open ? Math.min(1000, Math.max(120, this.peerRtt * 1.5 + 60)) : 0;
    const at = now() + lead;
    const dur = this.out.audio.duration || get().duration;
    let { playing } = this.anchor;
    let pos;
    if (action === 'play') {
      if (playing) return;
      playing = true;
      pos = this.out.audio.currentTime >= dur - 0.1 ? 0 : this.out.audio.currentTime;
      if (pos === 0) this.out.audio.currentTime = 0;
    } else if (action === 'pause') {
      if (!playing) return;
      playing = false;
      pos = this.out.position() + lead / 1000;
    } else if (action === 'seek') pos = Math.min(Math.max(0, Number(position) || 0), dur);
    else return;
    const anchor = { trackId: this.loadedId, playing, position: pos, at };
    this.applyAnchor(anchor);
    this.send({ type: action, ...anchor, by, quiet });
    if (!quiet && (action === 'play' || action === 'pause')) this.notifySynced();
    if (by === 'guest' && !quiet) this.noteAction(action, pos);
  }

  applyAnchor(s) {
    this.anchor = { trackId: s.trackId, playing: s.playing, position: s.position, at: s.at };
    set({ playing: s.playing });
    queueMicrotask(updateMediaPosition);
    if (s.trackId !== this.loadedId) return this.out.stopAt(now(), 0);
    const localAt = this.isGuest ? this.clock.toLocal(s.at) : s.at;
    if (s.playing) this.out.playAt(localAt, s.position);
    else this.out.stopAt(localAt, s.position);
  }

  /** Guest：心跳 → 漂移 → 微调或跳转 */
  onState(s) {
    if (this.forceResync !== false && s.trackId === this.loadedId) {
      const away = this.forceResync;
      this.forceResync = false;
      this.drift.reset();
      const before = s.playing ? this.out.position() - (s.position + (this.clock.toHost(now()) - s.at) / 1000) : 0;
      this.applyAnchor(s);
      if (away > 2 || Math.abs(before) > 0.05) note(`回到前台，已重新校准（离开 ${Math.round(away)}s，偏差 ${Math.round(before * 1000)}ms）`, 'sync');
      return;
    }
    if (s.trackId !== this.loadedId || s.playing !== this.out.intent) {
      if (s.trackId !== this.anchor.trackId || s.playing !== this.out.intent) {
        this.drift.reset();
        this.applyAnchor(s);
      } else this.anchor = { ...s };
      return;
    }
    this.anchor = { trackId: s.trackId, playing: s.playing, position: s.position, at: s.at };
    if (!s.playing || !this.clock.ready || this.out.audio.paused || this.out.audio.readyState < 3) return;
    const expected = s.position + (this.clock.toHost(now()) - s.at) / 1000;
    const r = this.drift.update(this.out.position() - expected, now());
    if (r.action === 'seek') {
      this.applyAnchor(s);
      note(`已自动校准延迟 ${Math.round(Math.abs(r.drift) * 1000)}ms`, 'sync');
    } else {
      this.out.setRate(r.rate);
      if (r.rate !== 1 && Math.abs(r.drift) > 0.05) note(`微调同步中（偏差 ${Math.round(r.drift * 1000)}ms）`, 'sync');
    }
    set({ drift: Math.round(r.drift * 1000), rate: r.rate });
  }

  tick() {
    // Host 心跳：广播实际播放位置
    if (!this.isGuest && this.loadedId && this.conn?.open && now() >= this.anchor.at) this.send({ type: 'state', ...this.stateMsg() });
    // 双向心跳：每秒一条，任何一方 3 秒收不到对方的任何消息就认为连接静默中断
    if (this.conn?.open) {
      this.send({ type: 'hb' });
      const silent = now() - this.lastRx;
      if (!document.hidden && silent > (this.peerBg ? BG_STALE_MS : STALE_MS)) {
        if (this.isGuest) this.reconnect('静默超时（3 秒没有心跳）');
        else if (!get().peerAway) {
          set({ peerAway: true });
          note(`${get().peer?.name || '对方'} 3 秒没有响应，等待 Ta 自动重连…`, 'warn');
        }
      }
    }
    // Guest 每 2 秒补一次时钟样本
    if (this.conn?.open && now() - this.lastPing > 2000) {
      this.lastPing = now();
      this.send({ type: 'ping', t0: now(), rtt: this.clock.rtt });
    }
  }

  stateMsg() {
    return this.out.intent
      ? { trackId: this.loadedId, playing: true, position: this.out.position(), at: now() }
      : { trackId: this.loadedId, playing: false, position: this.out.pausedAt, at: now() };
  }

  /** 自然播完：按播放模式决定下一首（单曲循环 = 原地重播，不重新解码、不重新传输） */
  onEnded() {
    if (this.isGuest) return;
    const next = this.syncQueue().peekNext({ auto: true });
    if (next && next === this.loadedId) return this.resumeFrom(0);
    if (next) return this.loadTrack(next, { autoplay: true, by: 'host', quiet: true, via: 'auto' });
    const anchor = { trackId: this.loadedId, playing: false, position: 0, at: now() };
    this.applyAnchor(anchor);
    this.send({ type: 'pause', ...anchor, by: 'host', quiet: true });
  }

  position() {
    let p;
    if (this.loadedId && this.loadedId === this.anchor.trackId) p = this.out.position();
    else if (this.anchor.playing) p = this.anchor.position + ((this.isGuest ? this.clock.toHost(now()) : now()) - this.anchor.at) / 1000;
    else p = this.anchor.position;
    return Math.min(Math.max(0, p), get().duration || Infinity);
  }

  setVolume(v) {
    this.out.setVolume(v);
    set({ volume: v });
    try { localStorage.setItem('hh.volume', String(v)); } catch {}
  }

  // ───────────────────────── 切歌
  async loadTrack(id, { autoplay = false, by = 'host', quiet = false, via = 'select' } = {}) {
    const token = ++this.token;
    // Media snapshots briefly say paused during ended/src changes. Keep the service
    // and its partial wake lock until this transition completes (or fails).
    set({ playbackPending: autoplay });
    try {
      const item = get().library.find((x) => x.id === id);
      const blob = this.blobs.get(id) || await this.blobFor(id);
      if (token !== this.token) return;
      if (!item || !blob) return item && toast(`本机找不到《${item.title}》的音频文件`, 'warn');
      this.syncQueue().moveTo(id, via); // 记入已播栈 / 从本轮随机中移除
      this.sendGen++;
      clearTimeout(this.autoplay?.timer);
      this.autoplay = null;
      this.loadedId = null;
      this.anchor = { trackId: id, playing: false, position: 0, at: now() };
      set({ currentId: id, loaded: false, playing: false, peerReady: false, duration: item.duration || 0, waitingPeer: false });
      this.send({ type: 'track', meta: item, by, quiet });
      this.broadcastLibrary();
      if (by === 'guest') note(`${get().peer?.name || '对方'} 切换到《${item.title}》`);
      let duration;
      const immediate = autoplay && !this.conn?.open;
      const startedAt = now();
      try {
        duration = await this.out.load(blob, { autoplay: immediate });
      } catch (e) {
        if (token !== this.token) return;
        this.out.stopAt(now(), 0);
        set({ playing: false });
        return toast(`无法播放《${item.title}》：${e.message}`, 'warn');
      }
      if (token !== this.token) return;
      this.loadedId = id;
      set({ loaded: true, duration });
      if (!item.duration || Math.abs(item.duration - duration) > 1) this.patch(id, { duration }); // 以实际解码时长为准
      if (!autoplay) return;
      if (immediate) {
        this.anchor = { trackId: id, playing: this.out.intent, position: 0, at: startedAt };
        set({ playing: this.out.intent && !this.out.audio.paused });
        return;
      }
      // 等对方缓冲好一起开始（最多 12 秒）
      if (!this.conn?.open || get().peerReady) return this.transport('play', 0, 'host', true);
      set({ waitingPeer: true });
      this.autoplay = { id, timer: setTimeout(() => this.startAutoplay(), PEER_WAIT_MS) };
    } finally {
      if (token === this.token) set({ playbackPending: false });
    }
  }

  startAutoplay() {
    const id = this.autoplay?.id;
    clearTimeout(this.autoplay?.timer);
    this.autoplay = null;
    set({ waitingPeer: false });
    if (id && id === this.loadedId) this.transport('play', 0, 'host', true);
  }

  guestTrack(m) {
    if (m.meta.id === this.loadedId && m.quiet) return set({ currentId: m.meta.id });
    const token = ++this.token;
    this.loadedId = null;
    this.drift.reset();
    this.out.stopAt(now(), 0);
    this.anchor = { trackId: m.meta.id, playing: false, position: 0, at: 0 };
    set({ currentId: m.meta.id, loaded: false, playing: false, playbackPending: false, duration: m.meta.duration || 0 });
    if (m.by === 'host' && !m.quiet) note(`${get().peer?.name || '对方'} 切换到《${m.meta.title}》`);
    const cached = this.blobs.get(m.meta.id);
    if (cached) return this.guestLoad(m.meta.id, cached, token);
    if (this.incoming.has(m.meta.id)) return; // 预缓存正在传这首：传完 fileDone 会直接加载，不必重新要

    if (m.meta.hash && get().offline.hashes.has(m.meta.hash)) {
      LocalLib.findByHash(m.meta.hash)
        .then((t) => t && LocalLib.getBlob(t.id))
        .then((blob) => {
          if (token !== this.token) return;
          if (!blob) return this.send({ type: 'need', id: m.meta.id });
          this.blobs.set(m.meta.id, blob);
          note('本机已存有这首歌，直接播放，无需传输', 'sync');
          this.guestLoad(m.meta.id, blob, token);
        })
        .catch(() => this.send({ type: 'need', id: m.meta.id }));
      return;
    }
    this.send({ type: 'need', id: m.meta.id });
  }

  async guestLoad(id, blob, token) {
    let duration;
    try {
      duration = await this.out.load(blob);
    } catch (e) {
      return toast(`解码失败：${e.message}`, 'warn');
    }
    if (token !== this.token) return;
    this.loadedId = id;
    set({ loaded: true, duration, transfer: null });
    this.send({ type: 'ready', id });
    if (this.anchor.trackId === id) this.applyAnchor(this.anchor); // 中途就绪：追到当前位置
    this.prefetchNext();
  }

  /**
   * Guest：当前这首就绪后，提前把房主队列里的下一首（歌单里的下一首）拉过来放进内存缓存。
   * 房主切到它时直接解码，不用再等传输。本机已有、正在传、或文件太大时不拉。
   */
  prefetchNext() {
    if (!this.isGuest || !this.conn?.open || !this.loadedId) return;
    const id = get().upNext;
    if (!id || id === this.loadedId || this.blobs.has(id) || this.incoming.has(id) || this.prefetching.has(id)) return;
    const item = get().library.find((x) => x.id === id);
    if (!item || (item.hash && get().offline.hashes.has(item.hash)) || (item.size || 0) > PREFETCH_MAX_BYTES) return;
    this.prefetching.add(id);
    this.send({ type: 'prefetch', id });
  }

  // ───────────────────────── 文件传输（Host → Guest 播放；Guest → Host 分享歌曲）
  async sendFile(id, blob, extra = {}) {
    if (!blob || !this.conn?.open) return;
    const background = extra.upload || extra.save || extra.prefetch; // 分享 / 保存 / 预缓存：与切歌无关，不能被切歌作废，也不能作废播放传输
    const gen = background ? this.sendGen : ++this.sendGen;
    const c = this.conn;
    const label = extra.upload ? '分享给房主' : extra.save ? '对方正在保存到本机' : extra.prefetch ? '对方在预缓存下一首' : '发送给对方';
    this.send({ type: 'file-begin', id, size: blob.size, mime: blob.type, ...extra });
    const buf = new Uint8Array(await blob.arrayBuffer());
    for (let off = 0; off < buf.length; off += CHUNK) {
      if (gen !== this.sendGen && !background) return; // 切歌了，旧的传输作废
      // 背压：PeerJS 自身队列 + DataChannel 缓冲超过 1MB 时等待
      while (c.open && (c.dataChannel?.bufferedAmount ?? 0) + (c.bufferSize ?? 0) * CHUNK > 1 << 20) await sleep(15);
      if (!c.open) return;
      c.send({ type: 'file-chunk', id, data: buf.slice(off, off + CHUNK).buffer });
      if ((off / CHUNK) % 32 === 0) set({ transfer: { dir: 'send', pct: off / buf.length, label } });
    }
    this.send({ type: 'file-end', id });
    set({ transfer: background ? null : { dir: 'send', pct: 1, label: '已发送，对方缓冲中' } });
  }

  fileDone(id) {
    const f = this.incoming.get(id);
    this.incoming.delete(id);
    this.prefetching.delete(id);
    if (!f) return;
    const blob = new Blob(f.chunks, { type: f.mime });
    set({ transfer: null });
    if (f.upload && !this.isGuest) {
      // Guest 分享过来的歌曲，加入 Host 曲库
      this.addToLibrary(blob, { ...f.meta, id, addedBy: get().peer?.name || '对方' });
      return note(`${get().peer?.name || '对方'} 添加了《${f.meta.title}》`);
    }
    this.blobs.set(id, blob);
    if (this.isGuest && this.blobs.size > 8) this.blobs.delete(this.blobs.keys().next().value);
    if (this.pendingSaves.has(id)) {
      this.pendingSaves.delete(id);
      const item = get().library.find((x) => x.id === id);
      if (item) persistLocal(blob, item).then((t) => t && note(`《${item.title}》已保存到本机，下次打开页面也在`));
    }
    if (id === get().currentId) this.guestLoad(id, blob, this.token);
  }

  /** Guest：把房主歌单里的一首存到自己的设备（手机）上 */
  async saveOffline(id) {
    const item = get().library.find((x) => x.id === id);
    if (!item) return;
    if (item.hash && get().offline.hashes.has(item.hash)) return toast('这首已经在本机曲库里了');
    const blob = this.blobs.get(id);
    if (blob) {
      const t = await persistLocal(blob, item);
      if (t) toast(`《${item.title}》已保存到本机`);
      return;
    }
    if (!this.conn?.open) return toast('尚未连接房主', 'warn');
    if (this.pendingSaves.has(id)) return;
    this.pendingSaves.add(id);
    this.send({ type: 'fetch', id });
    note(`正在从房主那里取《${item.title}》保存到本机…`);
  }

  // ───────────────────────── 曲库
  /**
   * 新歌入库：Host / 单机直接加入；Guest 则上传给 Host（曲库以 Host 为准）。
   * persist：同时存进本机 IndexedDB 曲库（下载的歌总是存；拖入的文件看"同时缓存"开关）。
   */
  async addToLibrary(blob, meta, { persist = false } = {}) {
    const hash = meta.hash || (await LocalLib.fingerprint(blob));
    const dup = get().library.find((x) => x.hash === hash);
    if (dup && !this.isGuest) {
      if (persist && !dup.localId) await persistLocal(blob, dup);
      toast(`《${dup.title}》已经在歌单里了`);
      return { ...dup, duplicate: true };
    }
    const item = {
      id: meta.id || uid(),
      hash,
      sourceId: meta.sourceId || null,
      localId: null,
      pageUrl: meta.pageUrl || null,
      fileName: meta.fileName || null,
      title: meta.title,
      artist: meta.artist || '',
      duration: meta.duration || null,
      size: blob.size,
      source: meta.source || 'local',
      sourceLabel: meta.sourceLabel || '本地',
      quality: meta.quality || (blob.type.includes('flac') ? 'FLAC' : (blob.type.split('/')[1] || '').toUpperCase() || '—'),
      cover: meta.cover || null,
      addedBy: meta.addedBy || get().me.name,
    };
    if (persist) {
      const t = await persistLocal(blob, item);
      if (t) item.localId = t.id;
    }
    if (this.isGuest) {
      if (!this.conn?.open) return toast(persist ? '已保存到本机，但尚未连接房主，没有分享' : '尚未连接房主', 'warn');
      this.sendFile(item.id, blob, { upload: true, meta: item });
      return note(`正在把《${item.title}》分享给房主`);
    }
    this.blobs.set(item.id, blob);
    set((s) => ({ library: [...s.library, item] }));
    this.broadcastLibrary();
    if (!item.duration) this.probeDuration(item.id, blob);
    if (!get().currentId) this.loadTrack(item.id);
    return item;
  }

  async importFiles(fileList, { playlists = [] } = {}) {
    const files = audioFilesOf(fileList);
    if (!files.length) return toast('没有可识别的音频文件', 'warn');
    // 选了歌单就必须存到本机（歌单只能引用本机曲库里的歌）
    const persist = get().cacheImports || playlists.length > 0;
    let added = 0;
    const itemIds = [];
    for (const f of files) {
      const r = await this.addToLibrary(f, { ...parseFileName(f.name), fileName: f.name, source: 'local', sourceLabel: '本地导入' }, { persist });
      if (r?.id) itemIds.push(r.id);
      if (r && !r.duplicate) added++;
    }
    const n = playlists.length ? await addItemsToPlaylists(playlists, itemIds, { quiet: true }) : 0;
    if (added || n) toast(`已导入 ${added} 首${n ? `，放入${playlistNames(playlists)}` : persist ? '，并缓存到本机曲库' : ''}`);
  }

  probeDuration(id, blob) {
    const a = new Audio();
    const url = URL.createObjectURL(blob);
    a.preload = 'metadata';
    a.src = url;
    a.onloadedmetadata = () => {
      this.patch(id, { duration: a.duration });
      URL.revokeObjectURL(url);
    };
  }

  remove(id) {
    if (this.isGuest || id === get().currentId) return;
    const item = get().library.find((x) => x.id === id);
    if (item?.localId) LocalLib.deleteTrack(item.localId).then(refreshOffline, (e) => toast(`删除失败：${e.message}`, 'warn'));
    this.blobs.delete(id);
    set((s) => ({ library: s.library.filter((x) => x.id !== id) }));
    this.broadcastLibrary();
  }

  patch(id, p) {
    set((s) => ({ library: s.library.map((x) => (x.id === id ? { ...x, ...p } : x)) }));
    this.broadcastLibrary();
  }

  broadcastLibrary() {
    if (!this.isGuest) {
      const q = this.syncQueue();
      set({ upNext: q.peekNext({ auto: true }), canNext: !!q.peekNext() });
      // Read the next local file while current audio is still audible. On ended,
      // loadTrack can use the bounded blob cache without awaiting the bridge.
      const next = get().upNext;
      if (isAndroid && next && next !== get().currentId && !this.prefetching.has(next)) {
        this.prefetching.add(next);
        this.blobFor(next).catch(console.warn).finally(() => this.prefetching.delete(next));
      }
    }
    const { library, currentId, playMode, upNext, canNext } = get();
    this.send({ type: 'library', items: library, currentId, playMode, upNext, canNext, playlist: this.isGuest ? undefined : this.playlistInfo() });
  }

  noteAction(action, pos) {
    const who = get().peer?.name || '对方';
    note({ play: `${who} 开始了播放`, pause: `${who} 暂停了播放`, seek: `${who} 把进度拖到了 ${fmtTime(pos)}` }[action]);
  }
}

const session = new Session();
observeAudio(session.out.audio, set, document, window.Capacitor?.isNativePlatform?.() ? nativePlugin('App') : null);
if (window.Capacitor?.isNativePlatform?.()) nativePlugin('App').addListener('appStateChange', ({ isActive }) => { if (isActive) session.onResume(); }).catch(console.warn);
window.__hh = { session, store, api, LocalLib }; // 调试用

// ════════════════════════════════════════════════════════════ 系统媒体控件（MediaSession）
// 锁屏 / 通知栏 / 耳机线控 / 键盘媒体键 / 蓝牙耳机按键 → 播放、暂停、上一首、下一首、拖动进度。
// Guest 按下这些键同样走 session.act()，会变成发给房主的请求，双方一起切。
// 有声音在播放时，浏览器会把页面当作"正在播放媒体"，切后台通常可继续播放，但仍受系统音频焦点及进程管理限制。
const mediaSession = 'mediaSession' in navigator ? navigator.mediaSession : null;
if (isAndroid) {
  const nativeMedia = nativePlugin('PlaybackSession');
  nativeMedia.addListener('action', ({ action, position }) => session.act(action, { position })).catch(console.warn);
  let previous = '';
  let pending = Promise.resolve();
  const update = () => {
    const s = get(), item = s.library.find(x => x.id === s.currentId);
    const state = { active: !!item, playing: s.playing, title: item?.title || '', artist: item?.artist || '',
      duration: Number.isFinite(s.duration) ? s.duration : 0, position: Math.max(0, session.position() || 0), canNext: s.canNext };
    pending = pending.then(() => nativeMedia.update(state)).catch(console.warn);
  };
  store.subscribe(() => {
    const s = get();
    const key = JSON.stringify([s.currentId, s.playing, s.duration, s.canNext]);
    if (key !== previous) { previous = key; update(); }
  });
  session.out.audio.addEventListener('seeked', update);
  session.out.audio.addEventListener('ratechange', update);
  document.addEventListener('visibilitychange', update);
}
const artCache = new Map();

/** 没有封面时画一张（系统控件里不能是空白） */
function fallbackArtwork(title) {
  if (artCache.has(title)) return artCache.get(title);
  const c = Object.assign(document.createElement('canvas'), { width: 512, height: 512 });
  const g = c.getContext('2d');
  let h = 0;
  for (const ch of title) h = (h * 31 + ch.codePointAt(0)) % 360;
  const grad = g.createLinearGradient(0, 0, 512, 512);
  grad.addColorStop(0, `hsl(${h} 70% 55%)`);
  grad.addColorStop(1, `hsl(${(h + 50) % 360} 65% 35%)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, 512, 512);
  g.fillStyle = 'rgba(255,255,255,0.85)';
  g.font = 'bold 220px system-ui, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText([...title][0] || '♪', 256, 270);
  const url = c.toDataURL('image/png');
  artCache.set(title, url);
  return url;
}

function updateMediaPosition() {
  const d = get().duration;
  if (!mediaSession?.setPositionState || !get().loaded || !d || !Number.isFinite(d)) return;
  try {
    mediaSession.setPositionState({ duration: d, playbackRate: session.out.audio.playbackRate || 1, position: Math.min(d, Math.max(0, session.position())) });
  } catch {}
}

if (mediaSession) {
  const handlers = {
    play: () => session.act('play'),
    pause: () => session.act('pause'),
    stop: () => session.act('pause'),
    previoustrack: () => session.act('prev'),
    nexttrack: () => session.act('next'),
    seekto: (d) => session.act('seek', { position: d.seekTime }),
    seekbackward: (d) => session.act('seek', { position: session.position() - (d.seekOffset || 10) }),
    seekforward: (d) => session.act('seek', { position: session.position() + (d.seekOffset || 10) }),
  };
  const bind = (name, fn) => {
    try {
      mediaSession.setActionHandler(name, fn);
    } catch {} // 老浏览器不认识某些动作（如 seekto / stop）
  };
  for (const [k, fn] of Object.entries(handlers)) bind(k, fn);

  const last = {};
  store.subscribe(() => {
    const s = get();
    const item = s.library.find((x) => x.id === s.currentId) || null;
    const metaKey = item && `${item.id}|${item.title}|${item.artist}|${item.cover}|${s.role}`;
    if (metaKey !== last.metaKey) {
      last.metaKey = metaKey;
      mediaSession.metadata = item
        ? new MediaMetadata({
            title: item.title,
            artist: item.artist || item.sourceLabel || '',
            album: s.role === 'host' ? 'Half&Half · 和伙伴同步收听' : s.role === 'guest' ? `Half&Half · 正在听 ${s.peer?.name || '房主'} 的歌` : 'Half&Half',
            artwork: item.cover
              ? [{ src: item.cover, sizes: '512x512' }, { src: fallbackArtwork(item.title), sizes: '512x512', type: 'image/png' }]
              : [{ src: fallbackArtwork(item.title), sizes: '512x512', type: 'image/png' }],
          })
        : null;
    }
    const state = !item ? 'none' : s.playing ? 'playing' : 'paused';
    if (state !== last.state || s.duration !== last.duration || s.loaded !== last.loaded) {
      last.state = state;
      last.duration = s.duration;
      last.loaded = s.loaded;
      mediaSession.playbackState = state;
      updateMediaPosition();
    }
    // 没有下一首 / 上一首时隐藏系统控件里的按钮
    const canPrev = !!item;
    if (s.canNext !== last.canNext) bind('nexttrack', (last.canNext = s.canNext) ? handlers.nexttrack : null);
    if (canPrev !== last.canPrev) bind('previoustrack', (last.canPrev = canPrev) ? handlers.previoustrack : null);
  });
  // 播放速率微调（同步追赶）会让系统进度条慢慢偏，定期校正
  setInterval(() => !document.hidden && updateMediaPosition(), 5000);
}

// ════════════════════════════════════════════════════════════ Android App（Capacitor）：前台服务保活
// 套上 Capacitor 外壳后，WebView 切到后台容易被系统回收，播放会断。有歌在播时开一个"媒体播放"类型的
// 前台服务（状态栏常驻通知），降低进程回收风险，但不保证永不被系统终止。在普通浏览器里 NativeFG 为 null，下面整段什么都不做。
const NativeFG = (() => {
  const C = window.Capacitor;
  if (!C?.isNativePlatform?.() || C.getPlatform?.() !== 'android') return null;
  try {
    return nativePlugin('ForegroundService');
  } catch {
    return null;
  }
})();

if (NativeFG) {
  let running = false, lastKey = '', asked = false;
  let work = Promise.resolve();
  const sync = async () => {
    const s = get();
    const item = s.library.find(x => x.id === s.currentId);
    // Read current state inside the serialized job, never a stale subscription snapshot.
    if (!item || !(s.playing || s.playbackPending || session.out.intent)) {
      if (running) await NativeFG.stopForegroundService();
      running = false; lastKey = ''; return;
    }
    const key = item.id + '|' + item.title + '|' + item.artist;
    if (running && key === lastKey) return;
    const opts = {
      id: 4101, title: item.title || 'Half&Half', body: item.artist || '正在播放',
      smallIcon: 'ic_stat_music', serviceType: 2, silent: true, notificationChannelId: 'playback',
      buttons: [{ id: 1, title: '上一首' }, { id: 2, title: '暂停' }, { id: 3, title: '下一首' }],
    };
    if (!running) {
      await NativeFG.createNotificationChannel({ id: 'playback', name: '音乐播放', importance: 2 });
      // Start promptly while visible. Notification permission is not a prerequisite for an FGS.
      await NativeFG.startForegroundService(opts);
      running = true;
      if (!asked && !document.hidden) {
        asked = true;
        NativeFG.requestPermissions().catch(console.warn);
      }
    } else await NativeFG.updateForegroundService(opts);
    lastKey = key;
  };
  const enqueue = () => { work = work.then(sync).catch(e => {
    console.warn('后台播放服务失败', e);
    toast('后台播放服务启动失败，请返回前台重试', 'warn');
  }); };
  let desiredKey;
  store.subscribe(() => {
    const s = get(), item = s.library.find(x => x.id === s.currentId);
    const key = JSON.stringify([s.playing || s.playbackPending || session.out.intent, item?.id, item?.title, item?.artist]);
    // A toast or progress update must not cause an endless failed-service retry loop.
    if (key === desiredKey) return;
    desiredKey = key;
    enqueue();
  });
  NativeFG.addListener('buttonClicked', ({ buttonId }) => session.act(({ 1: 'prev', 2: 'pause', 3: 'next' })[buttonId])).catch(console.warn);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) enqueue(); });
}

// ════════════════════════════════════════════════════════════ 本机离线曲库（IndexedDB）
/** IndexedDB 记录 → 歌单条目 */
function fromLocal(t, cover) {
  return {
    id: t.id, localId: t.id, hash: t.hash, sourceId: t.sourceId,
    title: t.title, artist: t.artist, duration: t.duration, size: t.size,
    source: t.source, sourceLabel: t.sourceLabel, quality: t.quality || (t.ext || '').toUpperCase(),
    cover, addedBy: get().me.name, addedAt: t.addedAt,
  };
}

/** 写入本机曲库；失败（空间不足等）只提示，不影响播放 */
async function persistLocal(blob, item) {
  try {
    const { track, existed } = await LocalLib.saveTrack(blob, {
      id: item.id, hash: item.hash, title: item.title, artist: item.artist, duration: item.duration,
      quality: item.quality, source: item.source, sourceLabel: item.sourceLabel, sourceId: item.sourceId,
      pageUrl: item.pageUrl, cover: item.cover, fileName: item.fileName,
    });
    if (!existed) {
      // 同一首歌在歌单里的条目也记下 localId，之后删除 / 懒加载都靠它
      set((s) => ({ library: s.library.map((x) => (x.hash === track.hash && !x.localId && !session.isGuest ? { ...x, localId: track.id } : x)) }));
    }
    await refreshOffline();
    LocalLib.requestPersist(); // 第一次存歌时申请持久化，避免被浏览器自动清理
    return track;
  } catch (e) {
    toast(`保存到本机失败：${e.message}`, 'warn');
    return null;
  }
}

async function refreshOffline() {
  try {
    const tracks = await LocalLib.listTracks();
    set({ offline: { ready: true, hashes: new Set(tracks.map((t) => t.hash)), count: tracks.length } });
    for (const t of tracks) trackMeta.set(t.id, toCloudTrack(t));
    // 删掉的歌从所有歌单里摘掉；登录账号时改为"未下载"留在歌单里（只是这台设备腾空间，歌单不变）
    playlistStore.prune(new Set(tracks.map((t) => t.id)), (id) => (cloudSync.enabled ? trackMeta.get(id) : null)).catch(() => {});
  } catch (e) {
    set({ offline: { ready: true, hashes: new Set(), count: 0, error: e.message } });
  }
}
// 其他标签页改了本机曲库（存歌 / 删除）也同步刷新
LocalLib.subscribe(() => refreshOffline());

// ════════════════════════════════════════════════════════════ 歌单（数据与规则见 playlists.js）
const playlistStore = new PlaylistStore(LocalLib);
playlistStore.subscribe((list) => {
  const s = get();
  const alive = (id) => id === ALL_ID || list.some((p) => p.id === id);
  set({
    playlists: list,
    playlistsReady: true,
    ...(!alive(s.viewPlaylistId) && { viewPlaylistId: ALL_ID }),
    ...(s.activePlaylistId && !alive(s.activePlaylistId) && { activePlaylistId: null }),
  });
  // 正在播放的歌单内容变了（加歌 / 移除）：队列和 Guest 端跟着更新
  if (s.activePlaylistId && !session.isGuest) session.broadcastLibrary();
});

// ════════════════════════════════════════════════════════════ 账号：歌单自动同步 + 昵称（规则见 cloudSync.js）
const trackMeta = new Map(); // 本机 tracks.id → 云端曲目信息（删除文件时用来保留"未下载"条目）
const syncBaseKey = (uid) => `hh.sync.${uid}`;
const cloudSync = new CloudSync({
  client: account,
  store: playlistStore,
  listTracks: () => LocalLib.listTracks(),
  loadBase: async (uid) => { try { return JSON.parse(localStorage.getItem(syncBaseKey(uid)) || 'null'); } catch { return null; } },
  saveBase: async (uid, base) => { try { localStorage.setItem(syncBaseKey(uid), JSON.stringify(base)); } catch {} },
  onStatus: (status) => set({ cloudSync: status }),
});
playlistStore.subscribe((_list, source) => { if (source !== 'remote' && playlistStore.ready) cloudSync.schedule(); });
setInterval(() => { if (!document.hidden && playlistStore.ready) (cloudSync.sync().catch(() => {}), syncProfile()); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && playlistStore.ready) (cloudSync.sync().catch(() => {}), syncProfile()); });

/** 下载歌单里"未下载"的歌（keys 为空 = 全部），保存到本机后自动归入歌单 */
async function downloadPending(playlistId, keys) {
  const todo = (playlistStore.get(playlistId)?.pending || []).filter((t) => !keys || keys.includes(t.id));
  const job = (id, v) => set((s) => { const n = { ...s.pendingJobs }; v ? (n[id] = v) : delete n[id]; return { pendingJobs: n }; });
  let ok = 0;
  for (const t of todo) {
    if (get().pendingJobs[t.id]?.state === 'loading') continue;
    job(t.id, { state: 'loading' });
    try {
      await cacheCloudTrack(t, { storage: LocalLib, download: (x) => downloadCloudTrack(account, x) });
      job(t.id, null);
      ok++;
    } catch (e) {
      job(t.id, { state: 'error', message: e.message });
    }
  }
  if (ok) {
    await session.restoreLocal();
    await cloudSync.sync().catch(() => {});
    toast(`已下载 ${ok} 首到本机`);
  }
  if (todo.length > ok && todo.length > 1) toast(`${todo.length - ok} 首下载失败，原因标在歌单里`, 'warn');
}

/** 原音源失效：换成重新搜到的链接 */
async function replacePendingSource(playlistId, key, url) {
  const r = await account.request(`/api/resolve?url=${encodeURIComponent(url)}`);
  if (!r.track?.id) throw new Error('无法识别这个链接');
  await playlistStore.replacePending(playlistId, key, { id: r.track.id, sourceId: r.track.id, pageUrl: r.track.pageUrl || url, hash: '' });
  set((s) => { const n = { ...s.pendingJobs }; delete n[key]; return { pendingJobs: n }; });
  toast('音源已替换，可以重新下载');
}

/** 改昵称：本机立即生效、房间里的对方同步看到；登录账号时同时保存到账号，其他设备打开时跟着更新 */
async function setMyName(nick, { push = true } = {}) {
  const name = String(nick || '').replace(/\s+/g, ' ').trim().slice(0, 16);
  if (!name) return;
  if (push && cloudSync.enabled) {
    try { await account.request('/account/profile', { nickname: name }, 'PUT'); }
    catch (e) { toast(e.code === 'NICKNAME_TAKEN' ? '该昵称已被使用，请换一个昵称' : `昵称保存失败：${e.message}`, 'warn'); return false; }
  }
  if (name !== get().me.name) {
    set({ me: profileOf(name) });
    try { localStorage.setItem(`hh.name.${account.user?.id || 'local'}`, name); } catch {}
    session.send({ type: 'hello', ...get().me });
  }
  return true;
}
/** 登录后以账号资料为准；不把设备上另一个账号留下的昵称写入新账号。 */
async function syncProfile() {
  if (!cloudSync.enabled) return;
  try {
    const { nickname } = await account.request('/account/profile');
    await setMyName(nickname || account.user.username, { push: false });
  } catch (e) { console.warn('[profile]', e.message); }
}

const ASK_PLAYLIST_KEY = 'hh.askPlaylist'; // '0' = 下载 / 导入时不再询问，直接放进默认曲库
const audioFilesOf = (fileList) => [...fileList].filter((f) => f.type.startsWith('audio/') || /\.(mp3|flac|m4a|aac|wav|ogg|opus|webm)$/i.test(f.name));
const playlistName = (id) => (id === ALL_ID ? ALL_NAME : playlistStore.get(id)?.name || '歌单');
const playlistNames = (ids) => ids.map((id) => `《${playlistName(id)}》`).join('');

/**
 * 弹出"放到哪个歌单"选择框。返回选中的歌单 id 数组；取消返回 null。
 * mode：'download' | 'import'（新歌入库前）· 'add'（已有曲目"添加到其他歌单"，已在其中的显示为已勾选、不可取消）
 */
function askPlaylists({ title, subtitle = '', mode = 'download', preselect = null } = {}) {
  if (get().role === 'guest') return Promise.resolve([]); // 在别人的房间里：歌曲进房主曲库，歌单不适用
  if (mode !== 'add' && stored(ASK_PLAYLIST_KEY) === '0') return Promise.resolve([INBOX_ID]);
  return new Promise((resolve) => {
    get().playlistPicker?.resolve(null);
    set({ playlistPicker: { title, subtitle, mode, preselect, resolve } });
  });
}
function closePlaylistPicker(result) {
  const p = get().playlistPicker;
  set({ playlistPicker: null });
  p?.resolve(result);
}

/** 歌单里有、但还不在当前曲库列表里的歌：从本机读出元数据加进来 */
async function ensureInLibrary(trackIds) {
  if (!trackIds.length) return;
  const add = [];
  for (const id of trackIds) {
    const t = await LocalLib.getTrack(id).catch(() => null);
    if (t) add.push(fromLocal(t, await LocalLib.coverUrl(t).catch(() => null)));
  }
  if (add.length) set((s) => ({ library: [...s.library, ...add.filter((x) => !s.library.some((y) => y.localId === x.localId))] }));
}

/** 曲库条目 → 本机 tracks.id；还没存到本机的（演示下载 / 没勾缓存的导入）先存进去 */
async function localIdsFor(itemIds) {
  const out = [];
  for (const id of itemIds) {
    const item = get().library.find((x) => x.id === id);
    if (!item) continue;
    if (item.localId) {
      out.push(item.localId);
      continue;
    }
    const blob = await session.blobFor(id);
    const t = blob && (await persistLocal(blob, item));
    if (!t) continue;
    set((s) => ({ library: s.library.map((x) => (x.id === id ? { ...x, localId: t.id } : x)) }));
    out.push(t.id);
  }
  return out;
}

async function addItemsToPlaylists(playlistIds, itemIds, { quiet = false } = {}) {
  const targets = playlistIds.filter((id) => id !== ALL_ID);
  if (!targets.length || !itemIds.length) return 0;
  const ids = await localIdsFor(itemIds);
  if (!ids.length) {
    toast('这首歌没能保存到本机，无法加入歌单', 'warn');
    return 0;
  }
  try {
    await playlistStore.addTracks(targets, ids);
  } catch (e) {
    toast(`加入歌单失败：${e.message}`, 'warn');
    return 0;
  }
  if (!quiet) toast(`已加入${playlistNames(targets)}`);
  return ids.length;
}

async function removeItemFromPlaylist(playlistId, itemId) {

// ════════════════════════════════════════════════════════════ 下载动作
async function downloadResult(r, onProgress, { playlists = [] } = {}) {
  const setDl = (patch) => set((s) => ({ downloads: { ...s.downloads, [r.id]: { ...s.downloads[r.id], ...patch } } }));
  setDl({ status: 'downloading', progress: 0, error: null });
  try {
    const { blob, demo, remote } = await api.download(r, (p) => {
      setDl({ progress: p });
      onProgress?.(p);
    });
    if (remote) {
      setDl({ status: 'done', progress: 1 }); // 房主已入库并同步曲库
      saveWhenListed(r.id); // 手机上点的下载：再从房主那里取一份存到手机本地
      return true;
    }
    const item = await session.addToLibrary(blob, {
      sourceId: r.id,
      pageUrl: r.pageUrl,
      title: demo ? `${r.title}（演示）` : r.title,
      artist: r.artist,
      duration: demo ? null : r.duration, // 演示音频时长与搜索结果不同，入库后实测
      source: r.source,
      sourceLabel: r.sourceLabel,
      quality: demo ? 'WAV' : r.quality,
      cover: r.cover,
    }, { persist: !demo || playlists.length > 0 }); // 演示音频平时不存；用户明确放进歌单时才存
    setDl({ status: 'done', progress: 1 });
    if (item?.id && playlists.length && (await addItemsToPlaylists(playlists, [item.id], { quiet: true }))) {
      toast(`《${item.title}》已放入${playlistNames(playlists)}`);
    }
    return true;
  } catch (e) {
    setDl({ status: 'error', error: e.message });
    toast(`下载失败：${e.message}`, 'warn');
    return false;
  }
}

/** Guest：等房主的歌单里出现这首（按平台 id 识别），然后存到本机 */
function saveWhenListed(sourceId, timeout = 20000) {
  const find = () => get().library.find((x) => x.sourceId === sourceId);
  if (find()) return session.saveOffline(find().id);
  const stop = store.subscribe(() => {
    const item = find();
    if (!item) return;
    stop();
    clearTimeout(timer);
    session.saveOffline(item.id);
  });
  const timer = setTimeout(stop, timeout);
}

// ════════════════════════════════════════════════════════════ 经房主代办的搜索 / 下载（RPC over DataChannel）
// 手机等非房主设备访问不到 music-service（只对房主电脑本机开放），
// 加入房间后把请求经 P2P 发给房主，由房主调用本机的 music-service，再把结果 / 进度传回来。
//   Guest → Host  rpc{id, method: 'health'|'search'|'download', args}
//   Host → Guest  rpc-progress{id, p}   rpc-result{id, result | error}
const rpcPending = new Map();
function rpc(method, args, onProgress) {
  if (!session.conn?.open || !session.isGuest) {
    return Promise.reject(new Error('搜索由房主提供：接受好友的同听邀请后即可搜索、下载真实音乐'));
  }
  const id = uid();
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      rpcPending.delete(id);
      reject(new Error('房主电脑响应超时'));
    }, method === 'download' ? 15 * 60_000 : 45_000);
    rpcPending.set(id, { resolve, reject, onProgress, timer });
    session.send({ type: 'rpc', id, method, args });
  });
}
function onRpcReply(m) {
  const p = rpcPending.get(m.id);
  if (!p) return;
  if (m.type === 'rpc-progress') return p.onProgress?.(m.p);
  clearTimeout(p.timer);
  rpcPending.delete(m.id);
  m.error ? p.reject(new Error(m.error)) : p.resolve(m.result);
}
/** Host：执行伙伴的请求。只开放搜索与下载，下载结果进入房主曲库 */
async function handleRpc(m) {
  const reply = (body) => session.send({ type: 'rpc-result', id: m.id, ...body });
  if (get().apiMode !== 'live') return reply({ error: '房主电脑没有启动音乐服务（cd music-service && npm start）' });
  try {
    if (m.method === 'health') return reply({ result: { sources: get().sources } });
    if (m.method === 'resolve') return reply({ result: await api.resolve(String(m.args?.url || '').slice(0, 2000)) });
    if (m.method === 'search') return reply({ result: await api.search(String(m.args?.q || '').slice(0, 100), m.args?.sources || []) });
    if (m.method === 'download') {
      const r = m.args?.result;
      if (!r?.id || r.mock) return reply({ error: '无效的曲目' });
      note(`${get().peer?.name || '对方'} 正在下载《${r.title}》`);
      const ok = await downloadResult(r, (p) => session.send({ type: 'rpc-progress', id: m.id, p }));
      return ok ? reply({ result: true }) : reply({ error: get().downloads[r.id]?.error || '下载失败' });
    }
    reply({ error: `不支持的操作：${m.method}` });
  } catch (e) {
    reply({ error: e.message });
  }
}

function useLinkStatus() {
  const conn = useStore((s) => s.conn);
  const playing = useStore((s) => s.playing);
  const loaded = useStore((s) => s.loaded);
  const role = useStore((s) => s.role);
  const peerReady = useStore((s) => s.peerReady);
  if (conn === 'open' && playing && loaded && (role === 'guest' || peerReady)) return { key: 'sync', label: '同步中', dot: 'bg-sync', ping: true };
  if (conn === 'open') return { key: 'shake', label: '握手成功', dot: 'bg-host' };
  if (conn === 'reconnecting') return { key: 'rc', label: '自动重连中…', dot: 'bg-host animate-pulse' };
  if (conn === 'waiting') return { key: 'wait', label: get().peer ? '等待对方重连' : '等待对方加入', dot: 'bg-sand-500 animate-pulse' };
  if (conn === 'connecting' || conn === 'opening') return { key: 'conn', label: '连接中…', dot: 'bg-host animate-pulse' };
  return { key: 'idle', label: '未连接', dot: 'bg-ink-600' };
}

  const [creating, setCreating] = useState(false);
  const [name, setName] = useState('');
  const create = async (e) => {
    e.preventDefault();
    try {
      const p = await playlistStore.create(name);
      setName('');
      setCreating(false);
      set({ viewPlaylistId: p.id });
    } catch (err) {
      toast(err.message, 'warn');
    }
  };
  const [asking, setAsking] = useState(() => stored(ASK_PLAYLIST_KEY) !== '0');
  const restoreAsking = () => {
    try { localStorage.removeItem(ASK_PLAYLIST_KEY); } catch {}
    setAsking(true);
    toast('已恢复：下载 / 导入时会询问放进哪个歌单');
  };
  const chips = [{ id: ALL_ID, name: '全部', count: libraryCount }, ...playlists.map((p) => ({ id: p.id, name: p.name, count: p.trackIds.length, system: p.system }))];
  return html`<div class="border-b border-ink-700/60 px-3 py-2.5">
    ${!asking && html`<div class="mb-2 flex items-center gap-2 px-1 text-[11px] text-sand-500">
      下载 / 导入的歌直接进「默认曲库」<button class="text-host hover:underline" onClick=${restoreAsking}>恢复询问歌单</button>
    </div>`}
    <div class="scroll-thin -mx-1 flex items-center gap-2 overflow-x-auto px-1 pb-1" role="tablist" aria-label="我的歌单">
      ${chips.map((c) => {
        const on = c.id === view;
        const playingHere = playing && (c.id === ALL_ID ? !active : active === c.id);
        return html`<button key=${c.id} role="tab" aria-selected=${on} onClick=${() => set({ viewPlaylistId: c.id })}
          class=${cx('inline-flex shrink-0 items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs transition', on ? 'border-host/60 bg-host/15 text-sand-50' : 'border-ink-700 text-sand-400 hover:text-sand-100')}>
          ${playingHere && html`<span class="eq inline-flex h-2.5 items-end" aria-label="正在播放"><i /><i /><i /></span>`}
          <span class="max-w-[9rem] truncate">${c.name}</span>
          <span class="tabular text-sand-500">${c.count}</span>
        </button>`;
      })}
      ${creating
        ? html`<form class="flex shrink-0 items-center gap-1" onSubmit=${create}>
            <input autofocus value=${name} onInput=${(e) => setName(e.target.value)} maxlength="40" placeholder="歌单名称" aria-label="新歌单名称"
              class="w-32 rounded-full border border-host/60 bg-ink-900 px-3 py-1.5 text-xs outline-none placeholder:text-sand-500"
              onKeyDown=${(e) => e.key === 'Escape' && (setCreating(false), setName(''))} />
            <button class="rounded-full bg-host px-3 py-1.5 text-xs font-semibold text-ink-950 disabled:opacity-40" disabled=${!name.trim()}>创建</button>
            <button type="button" class="grid h-7 w-7 place-items-center rounded-full text-sand-400 hover:text-sand-50" onClick=${() => (setCreating(false), setName(''))} aria-label="取消新建"><${X} size=${14} /></button>
          </form>`
        : html`<button class="inline-flex shrink-0 items-center gap-1 rounded-full border border-dashed border-host/50 px-3 py-1.5 text-xs font-medium text-host hover:bg-host/10" onClick=${() => setCreating(true)}>
            <${Plus} size=${13} /> 新建歌单
          </button>`}
    </div>
  </div>`;
}

/** 当前查看的歌单头部：名称 / 曲目数 / 播放全部（房主在房间里是"在房间中播放"）/ 改名 / 删除 */
function PlaylistHeader({ view, items }) {
  const playlist = useStore((s) => (view === ALL_ID ? null : s.playlists.find((p) => p.id === view)));
  const active = useStore((s) => s.activePlaylistId);
  const role = useStore((s) => s.role);
  const conn = useStore((s) => s.conn);
  const [renaming, setRenaming] = useState(false);
  const [name, setName] = useState('');
  const inRoom = role === 'host' && conn === 'open';
  const isActive = view === ALL_ID ? !active : active === view;
  const total = items.reduce((a, x) => a + (x.duration || 0), 0);
  const title = view === ALL_ID ? ALL_NAME : playlist?.name || '';
  const custom = playlist && !playlist.system;

  const rename = async (e) => {
    e.preventDefault();
    try {
      await playlistStore.rename(view, name);
      setRenaming(false);
    } catch (err) {
      toast(err.message, 'warn');
    }
  };
  const remove = async () => {
    if (!confirm(`删除歌单《${playlist.name}》？\n只删除歌单本身，里面的 ${playlist.trackIds.length} 首歌仍保留在本机曲库。`)) return;
    try {
      await playlistStore.remove(view);
      toast(`已删除歌单《${playlist.name}》`);
    } catch (err) {
      toast(err.message, 'warn');
    }
  };

  return html`<div class="flex flex-wrap items-center gap-x-3 gap-y-2.5 border-b border-ink-700/60 px-4 py-3">
    <${PlaylistCover} playlist=${playlist || { id: ALL_ID }} size=${52} />
    <div class="min-w-0 flex-1 basis-[calc(100%-64px)] sm:basis-0">
      ${renaming
        ? html`<form class="flex items-center gap-1.5" onSubmit=${rename}>
            <input autofocus value=${name} onInput=${(e) => setName(e.target.value)} maxlength="40" aria-label="歌单新名称"
              class="min-w-0 flex-1 rounded-lg border border-host/60 bg-ink-900 px-2.5 py-1.5 text-sm outline-none"
              onKeyDown=${(e) => e.key === 'Escape' && setRenaming(false)} />
            <button class="rounded-lg bg-host px-3 py-1.5 text-xs font-semibold text-ink-950 disabled:opacity-40" disabled=${!name.trim()}>保存</button>
            <button type="button" class="rounded-lg px-2 py-1.5 text-xs text-sand-400" onClick=${() => setRenaming(false)}>取消</button>
          </form>`
        : html`<div class="flex items-center gap-1.5">
            <h3 class="truncate text-sm font-semibold">${title}</h3>
            ${playlist?.system && html`<span class="shrink-0 rounded bg-white/5 px-1.5 text-[10px] text-sand-400" title="下载 / 导入时选「稍后整理」的歌放在这里">稍后整理</span>`}
            ${custom && html`<button class="grid h-7 w-7 shrink-0 place-items-center rounded-full text-sand-500 hover:text-sand-50" onClick=${() => (setName(playlist.name), setRenaming(true))} aria-label="重命名歌单" title="重命名"><${Pencil} size=${13} /></button>`}
          </div>`}
      <div class="mt-0.5 text-xs text-sand-500 tabular">${items.length} 首${playlist?.pending?.length ? ` · ${playlist.pending.length} 首未下载` : ''}${total ? ` · ${fmtTime(total)}` : ''}${isActive && items.length ? ' · 正在播放' : ''}</div>
    </div>
    <div class="flex w-full items-center gap-1.5 sm:w-auto sm:shrink-0">
      ${custom && !renaming && html`<button class="grid h-9 w-9 shrink-0 place-items-center rounded-full text-sand-500 hover:bg-guest/10 hover:text-guest" onClick=${remove} aria-label="删除歌单" title="删除歌单（歌曲保留）"><${Trash2} size=${15} /></button>`}

        disabled=${!items.length} onClick=${() => session.playPlaylist(view)}
