const html = htm.bind(React.createElement);

// ════════════════════════════════════════════════════════════ 配置
const params = new URLSearchParams(location.search);
// 音乐服务地址：?api= > 页面「连接设置」里填的 > app-config.js（部署时生成）> 本地 Vite 代理 /music-api
const HH = window.HH_CONFIG || {};
const stored = (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const API_BASE = (params.has('api') ? params.get('api') : stored('hh.api') || HH.apiBase || (location.protocol.startsWith('http') ? '/music-api' : '')).replace(/\/+$/, '');
// 公网部署的访问令牌（API_TOKEN）：只存在本机浏览器，绝不写进页面
const account = new AccountClient(API_BASE);
const accessToken = () => account.required ? account.token : stored('hh.apiToken');
const authHeaders = (h = {}) => (accessToken() ? { ...h, Authorization: `Bearer ${accessToken()}` } : h);
/** <audio> / EventSource 不能带请求头，令牌放在查询参数里 */
const apiUrl = (path) => `${API_BASE}${path}${accessToken() ? `${path.includes('?') ? '&' : '?'}token=${encodeURIComponent(accessToken())}` : ''}`;
const backendURL = new URL(HH.peerUrl || API_BASE || location.origin, location.href);
const PEER_OPTIONS = {
  host: params.get('peerHost') || backendURL.hostname,
  port: Number(params.get('peerPort')) || Number(backendURL.port) || (backendURL.protocol === 'https:' ? 443 : 80),
  path: params.get('peerPath') || HH.peerPath || `${backendURL.pathname.replace(/\/$/, '')}/peerjs`,
  secure: backendURL.protocol === 'https:',
  config: { iceServers: [] }, debug: 1,
};
const peerOptions = () => ({ ...PEER_OPTIONS, ...(accessToken() ? { token: accessToken() } : {}) });


// ─────────── ICE 服务器
// 来源（依次叠加）：
//   1. 本项目服务器的 /ice.json：默认 STUN + 服务端配置的 TURN（coturn / Metered / Cloudflare，凭证由服务端签发）
//      npm run dev:all 还会带上本机 TURN 中继（解决手机热点 / 设备隔离）
//   2. 页面「连接设置」里填的 TURN（localStorage）：页面部署在没有 /ice.json 的静态托管上、或想临时换一台 TURN 时用
// 跨境 / 4G / 对称 NAT 基本只能靠 TURN 中继；STUN 只能帮忙"打洞"，打不通就需要中继。
const DEFAULT_ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478', 'stun:stun.miwifi.com:3478', 'stun:stun.chat.bilibili.com:3478'] }];
const ICE_KEY = 'hh.ice';
const loadIceSettings = () => { try { return JSON.parse(localStorage.getItem(ICE_KEY)) || {}; } catch { return {}; } };
const turnUrlsOf = (text) => String(text || '').split(/[\s,]+/).filter((u) => /^turns?:[^\s]+$/.test(u));

/** Metered：用 API Key 换取短期 TURN 凭证（Metered 官方支持在浏览器里直接调用） */
async function fetchMeteredIce(domain, apiKey) {
  const host = String(domain).replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  const r = await fetch(`https://${host}/api/v1/turn/credentials?apiKey=${encodeURIComponent(apiKey)}`, { signal: AbortSignal.timeout(6000) });
  if (!r.ok) throw new Error(r.status === 401 ? 'Metered API Key 无效' : `Metered HTTP ${r.status}`);
  const list = await r.json();
  return list.filter((x) => [].concat(x.urls).some((u) => /^turns?:/.test(u)));
}

/** 组合出最终的 ICE 列表；返回值也用于界面上的"当前配置"说明 */
async function buildIce(settings = loadIceSettings()) {
  let servers = DEFAULT_ICE;
  let source = '内置 STUN';
  if (location.protocol.startsWith('http') || HH.iceUrl) {
    try {
      const r = await fetch(HH.iceUrl || `${API_BASE}/ice.json`, { headers: authHeaders(), signal: AbortSignal.timeout(HH.iceUrl ? 8000 : 3000), cache: 'no-store' }); // 后端在 Render 上时可能要冷启动
      const list = r.ok ? await r.json() : null;
      if (Array.isArray(list) && list.length) [servers, source] = [list, '服务器下发'];
    } catch {}
  }
  const extra = [];
  const errors = [];
  const urls = turnUrlsOf(settings.turnUrls);
  if (urls.length) extra.push({ urls, ...(settings.username && { username: settings.username, credential: settings.credential || '' }) });
  if (settings.meteredDomain && settings.meteredKey) {
    try {
      extra.push(...(await fetchMeteredIce(settings.meteredDomain, settings.meteredKey)));
    } catch (e) {
      errors.push(e.message);
    }
  }
  const all = [...servers, ...extra];
  const count = (re) => all.reduce((n, x) => n + [].concat(x.urls).filter((u) => re.test(u)).length, 0);
  return {
    iceServers: all,
    forceRelay: !!settings.forceRelay || params.has('relay'),
    summary: { source, stun: count(/^stun:/), turn: count(/^turns?:/), custom: extra.length > 0, errors, forceRelay: !!settings.forceRelay || params.has('relay') },
  };
}

async function applyIce(settings) {
  await null; // 让模块先执行完（store 在后面才创建）
  const c = await buildIce(settings);
  PEER_OPTIONS.config.iceServers = c.iceServers;
  if (c.forceRelay) PEER_OPTIONS.config.iceTransportPolicy = 'relay'; // 只走 TURN：用来确认中继是否可用
  else delete PEER_OPTIONS.config.iceTransportPolicy;
  set({ ice: c.summary });
  return c;
}
let iceReady = Promise.resolve();
// 每台设备一个固定 id：掉线重连时房主据此认出"还是刚才那个人"，直接替换旧连接
const CLIENT_ID = (() => {
  try {
    let id = localStorage.getItem('hh.cid');
    if (!id) localStorage.setItem('hh.cid', (id = Math.random().toString(36).slice(2, 12)));
    return id;
  } catch {
    return Math.random().toString(36).slice(2, 12);
  }
})();
const STALE_MS = 3000; // 3 秒收不到任何消息（心跳每秒一次）视为连接静默中断
const BG_STALE_MS = 60000; // 对方说自己切到后台了：后台计时器会被浏览器节流，放宽到 60 秒
const PEER_PREFIX = 'halfhalf-v1-'; // PeerJS ID = 前缀 + 6 位房间码
const CHUNK = 16000; // PeerJS binary 序列化单包上限约 16KB，按此分片可避免二次切分
const HEARTBEAT_MS = 1000;
const PEER_WAIT_MS = 12000;
const PREFETCH_MAX_BYTES = 80 * 1048576; // 超过这个大小的下一首不预缓存（Guest 内存里最多同时放 8 首）
// 与 music-service 实际接入的平台保持一致（网易云 / QQ / 开放免费库已移除：免费曲库里几乎没有原唱）
const MOCK_SOURCES = [
  { name: 'youtube', label: 'YouTube' },
  { name: 'bilibili', label: 'B站' },
];

// ════════════════════════════════════════════════════════════ 工具
const now = () => performance.timeOrigin + performance.now();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 10);
const fmtTime = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
};
const fmtSize = (b) => (!b ? '–' : b > 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.round(b / 1024)} KB`);
const hue = (s = '') => [...s].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7) % 360;
const gradient = (s) => `linear-gradient(135deg, hsl(${hue(s)} 55% 45%), hsl(${(hue(s) + 50) % 360} 60% 30%))`;
function parseFileName(name) {
  const base = name.replace(/\.[^.]+$/, '');
  const m = base.match(/^(.+?)\s+-\s+(.+)$/);
  return m ? { artist: m[1], title: m[2] } : { artist: '本地文件', title: base };
}
function qualityOf(t) {
  const f = (t.format || '').toUpperCase();
  if (f === 'FLAC') return 'FLAC';
  if (t.bitrate >= 320 && !t.bitrateEstimated) return '320k';
  if (t.bitrate) return `${t.bitrateEstimated ? '≈' : ''}${t.bitrate}k`;
  return f || '—';
}

// ════════════════════════════════════════════════════════════ Store
function createStore(initial) {
  let state = initial;
  const subs = new Set();
  return {
    get: () => state,
    set(patch) {
      state = { ...state, ...(typeof patch === 'function' ? patch(state) : patch) };
      subs.forEach((f) => f());
    },
    subscribe: (f) => (subs.add(f), () => subs.delete(f)),
  };
}

const PROFILE_COLORS = ['#f2a65a', '#ec7a96', '#71d6a4', '#8ea2ff', '#e6c56b'];
const profileOf = (name) => ({ name: name.slice(0, 16), color: PROFILE_COLORS[hue(name) % PROFILE_COLORS.length] });
function loadProfile() {
  const saved = (() => { try { return localStorage.getItem('hh.name'); } catch { return null; } })();
  const name = params.get('name') || saved || ['晚风', '橘子汽水', '海盐', '星期天', '月亮邮差'][Math.floor(Math.random() * 5)];
  // 第一次随机取的名字要记住：否则每次打开都换一个名字，对方也认不出你
  if (!saved && !params.get('name')) try { localStorage.setItem('hh.name', name); } catch {}
  return profileOf(name);
}

const store = createStore({
  // 连接
  role: null, // null（单机）| 'host' | 'guest'
  roomCode: null,
  conn: 'idle', // 'idle' | 'opening' | 'waiting' | 'connecting' | 'open' | 'reconnecting'
  link: null, // { kind: 'lan'|'p2p'|'relay', rtt, protocol }：当前实际走的路径

  pendingJobs: {}, // 未下载歌曲的下载状态 { [云端曲目 id]: { state: 'loading' | 'error', message } }
  peerAway: false, // 对方切到后台 / 暂时无响应

  me: loadProfile(),
  peer: null,
  // 搜索 / 下载
  apiMode: 'checking', // 'checking' | 'live' | 'mock'
  sources: MOCK_SOURCES,
  activeSources: [],
  query: '',
  searching: false,
  results: [],
  searchMeta: null,
  downloads: {}, // resultId → { status, progress, error }
  // 曲库 / 播放
  library: [], // [{ id, title, artist, duration, size, source, sourceLabel, quality, cover, addedBy }]
  currentId: null,
  loaded: false,
  playing: false,
  playbackPending: false,
  duration: 0,
  volume: Number((() => { try { return localStorage.getItem('hh.volume'); } catch { return null; } })() ?? 0.8),
  peerReady: false,
  waitingPeer: false,

  syncNote: null, // { text, kind: 'info'|'sync'|'warn', at }

  cacheImports: (() => { try { return localStorage.getItem('hh.cacheImports') !== '0'; } catch { return true; } })(),

  playMode: (() => { try { return localStorage.getItem('hh.playMode') || 'order'; } catch { return 'order'; } })(),
  upNext: null, // 自然播完后的下一首 id（单曲循环时等于当前曲目）
  canNext: false, // 手动"下一首"是否可用（顺序播放到最后一首时不可用）
  // 自定义歌单（见 playlists.js）
  playlists: [], // [{ id, name, trackIds（= 本机 tracks.id）, system? }]，第一个是「默认曲库」

// ════════════════════════════════════════════════════════════ 演示音频合成
// mock 下载会真的生成一段可播放的音频（和弦琶音 + 鼓点，按歌名决定调性和速度），整个流程可端到端演示
async function synthDemo(seedText, seconds = 32) {
  const sr = 22050;
  const ctx = new OfflineAudioContext(1, sr * seconds, sr);
  const h = hue(seedText);
  const root = 196 * Math.pow(2, (h % 12) / 12);
  const bpm = 84 + (h % 40);
  const beat = 60 / bpm;
  const progression = [[0, 4, 7], [9, 12, 16], [5, 9, 12], [7, 11, 14]];
  const master = ctx.createGain();
  master.gain.value = 0.32;
  master.connect(ctx.destination);
  const note = (freq, t, dur, type = 'triangle', vol = 0.25) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + dur + 0.05);
  };
  for (let t = 0, i = 0; t < seconds - 1; t += beat, i++) {
    const chord = progression[Math.floor(i / 8) % progression.length];
    const st = chord[i % 3] + (i % 6 >= 3 ? 12 : 0);
    note(root * Math.pow(2, st / 12), t, beat * 1.6);
    if (i % 4 === 0) note(root / 2 * Math.pow(2, chord[0] / 12), t, beat * 3.5, 'sine', 0.35);
    if (i % 2 === 0) note(55, t, 0.18, 'sine', 0.6); // 底鼓
  }
  const buf = await ctx.startRendering();
  // AudioBuffer → 16bit WAV
  const pcm = buf.getChannelData(0);
  const out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); out.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true); out.setUint32(24, sr, true);
  out.setUint32(28, sr * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
  return new Blob([out.buffer], { type: 'audio/wav' });
}

const viaHost = () => get().apiMode === 'remote' || (get().apiMode === 'auth' && get().role === 'guest' && get().conn === 'open');
const AUTH_HINT = '音乐服务需要访问令牌：点右上角「连接设置」，在"音乐服务"里填写 API_TOKEN';

const api = {
  async init() {

      if (r.status === 401) return set({ apiMode: 'auth', sources: MOCK_SOURCES });
      // 403：这台设备不是运行 music-service 的那台电脑（音乐服务只对本机开放，防止局域网里任何人往硬盘写文件）。
      // 改为 remote 模式：加入房间后，搜索/下载请求经 P2P 交给房主电脑执行。
      if (r.status === 403) return set({ apiMode: 'remote', sources: [] });

  /** GET /api/search?q=&sources= */

    const body = await r.json();

    return {
      results: body.results.map((t) => ({
        id: t.id,
        title: t.song?.title || t.title,
        artist: t.song?.artist || t.artist || t.uploader || '',
        source: t.source,
        sourceLabel: t.sourceName,
        quality: qualityOf(t.bitrate ? t : { ...t, bitrate: t.source === 'bilibili' ? 192 : null, bitrateEstimated: true }),
        duration: t.duration,
        size: (t.bitrate || (t.source === 'bilibili' ? 192 : 0)) && t.duration ? Math.round(((t.bitrate || 192) * 1000 * t.duration) / 8) : null,

  /** GET /api/resolve?url= → 链接对应的真实曲目（标题 / 时长 / 最高音质 / 体积）；演示模式返回 null */
  async resolve(url) {

    const r = await fetch(`${API_BASE}/api/resolve?${new URLSearchParams({ url })}`, { headers: authHeaders() });
    const body = await r.json();

    const t = body.track;
    const best = body.qualities.find((q) => String(q.id) === String(body.best)) || body.qualities[0];
    return {
      id: t.id,
      title: t.title,
      artist: t.artist || t.uploader || '',
      source: t.source,
      sourceLabel: t.sourceName,
      quality: best.lossless ? 'FLAC' : `${best.bitrate}k`,
      duration: t.duration,
      size: best.size,
      cover: t.cover,
      pageUrl: t.pageUrl,
      version: '来自链接',
      format: t.format,
      fromLink: true,
      hint: body.hint,
      platform: body.platform,
      uploader: t.uploader,
      plays: t.plays,
      qualities: body.qualities,
      qualityId: body.best,
      pages: body.pages,
    };
  },

  /**
   * POST /api/download → SSE 进度 → GET /files/<name>
   * @returns {Promise<{ blob: Blob, fileName: string }>}
