<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>正在播放 · 浅色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:#221d19;background:#f7f0e8}
a{color:#8a460c}a:hover{color:#713805}
button{font:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f0e8; display: flex; flex-direction: column; padding: 56px 16px 24px; gap: 20px; overflow: hidden">

  <!-- ConnectionBar: reconnecting state -->
  <div style="display: flex; align-items: center; gap: 12px; background: #ffffff; border: 1px solid #dccdbe; border-radius: 16px; padding: 12px 14px; box-shadow: 0 1px 2px rgb(0 0 0 / 6%)">
    <div style="display: flex; align-items: center; gap: 0">
      <div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #fff1df; color: #8a460c; border: 2px solid #f2a65a; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">K</div>
      <div aria-hidden="true" style="width: 28px; height: 2px; background: repeating-linear-gradient(90deg, #c4b3a3 0 4px, transparent 4px 8px)"></div>
      <div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #f4eee7; color: #86745f; border: 2px dashed #c4b3a3; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">M</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
      <div style="font-size: 14px; font-weight: 600; line-height: 21px">正在重新连接 Mia</div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 18px; color: #6b594a">
        <span style="display: inline-flex; align-items: center; gap: 4px; background: #fff3d6; color: #855000; padding: 1px 8px; border-radius: 999px; font-weight: 500">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          重连中
        </span>
        <span>本机继续播放</span>
      </div>
    </div>
    <button aria-label="房间设置" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #6b594a; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </button>
  </div>

  <!-- NowPlaying cover -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="width: 280px; height: 280px; border-radius: 24px; background: linear-gradient(145deg, #fff1df 0%, #f4eee7 45%, #fdebf1 100%); border: 1px solid #dccdbe; box-shadow: 0 16px 48px rgb(0 0 0 / 18%); position: relative; display: flex; align-items: center; justify-content: center">
      <div aria-hidden="true" style="width: 180px; height: 180px; border-radius: 50%; background: #0e0c0b; border: 10px solid #221d19; display: flex; align-items: center; justify-content: center">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(90deg, #f2a65a, #ec7a96)"></div>
      </div>
      <span style="position: absolute; left: 14px; top: 14px; font-size: 11px; letter-spacing: 0.06em; color: #6b594a; background: rgb(255 255 255 / 80%); padding: 3px 8px; border-radius: 999px">HALF &amp; HALF</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%">
      <div style="font-size: 20px; font-weight: 600; line-height: 28px; text-align: center">夜航星</div>
      <div style="font-size: 14px; line-height: 21px; color: #6b594a">河图 · 2017</div>
    </div>
  </div>

  <!-- Progress -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="263" aria-valuenow="96" tabindex="0" style="height: 44px; display: flex; align-items: center">
      <div style="position: relative; width: 100%; height: 4px; border-radius: 999px; background: #c4b3a3">
        <div style="position: absolute; left: 0; top: 0; height: 100%; width: 37%; border-radius: 999px; background: #8a460c"></div>
        <div style="position: absolute; left: 37%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #ffffff; border: 2px solid #8a460c; box-sizing: border-box"></div>
      </div>
    </div>
    <div class="num" style="display: flex; justify-content: space-between; font-size: 12px; line-height: 18px; color: #6b594a; margin-top: -12px">
      <span>1:36</span><span>4:23</span>
    </div>
  </div>

  <!-- PlayerControls -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
    <button aria-label="随机播放" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #6b594a; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
    </button>
    <button aria-label="上一首" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: #221d19; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5 9 12l11 7z"/></svg>
    </button>
    <button aria-label="播放" style="width: 72px; height: 72px; border: 0; border-radius: 50%; background: #8a460c; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgb(0 0 0 / 10%)">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button aria-label="下一首" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: #221d19; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
    </button>
    <button aria-label="循环播放" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #6b594a; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>

  <!-- Play mode toggle -->
  <div style="display: flex; justify-content: center">
    <div role="group" aria-label="播放模式" style="display: flex; background: #f4eee7; border: 1px solid #dccdbe; border-radius: 999px; padding: 3px; gap: 2px">
      <button aria-pressed="true" style="height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: #fdebf1; color: #a32f55; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6M21 20c0-3.3-2.7-6-6-6"/></svg>
        一起听
      </button>
      <button aria-pressed="false" style="height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #6b594a; font-size: 14px; font-weight: 500">各听各的</button>
    </div>
  </div>

  <!-- Toast -->
  <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; justify-content: flex-end">
    <div role="status" style="display: flex; align-items: center; gap: 10px; background: #221d19; color: #ffffff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 24px rgb(0 0 0 / 10%)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2a65a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span style="font-size: 14px; line-height: 20px; flex: 1">网络恢复后会自动重新对齐播放</span>
      <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #f2a65a; font-size: 13px; font-weight: 600">知道了</button>
    </div>
  </div>
</div>
</x-dc>
